<!doctype html>
<html
  lang="pt-BR"
  data-composition-variables='[
    {"id":"brand","type":"color","label":"Roxo KRO (marca e transformação)","default":"#7C3AED"},
    {"id":"signal","type":"color","label":"Ciano (sinal e destaque)","default":"#06B6D4"},
    {"id":"ground","type":"color","label":"Grafite (chão)","default":"#2B2B2B"},
    {"id":"sand","type":"color","label":"Areia (detalhe pontual)","default":"#D8C0A7"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1350" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      :root {
        --brand: #7c3aed;
        --signal: #06b6d4;
        --ground: #2b2b2b;
        --sand: #d8c0a7;
        --ground-deep: #1a1a1a;
        --ink: #ffffff;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1350px;
        overflow: hidden;
        background: var(--ground);
      }
      #root {
        width: 100%;
        height: 100%;
        position: relative;
      }
      /* Chão: grafite com queda radial e luz direcional vinda de cima-esquerda.
         Nunca preto puro, nunca um gradiente roxo/azul de fundo. */
      #ground {
        position: absolute;
        inset: 0;
        background:
          radial-gradient(
            116% 82% at 32% 18%,
            rgba(255, 255, 255, 0.055) 0%,
            rgba(255, 255, 255, 0) 46%
          ),
          radial-gradient(100% 78% at 50% 46%, var(--ground) 0%, var(--ground-deep) 100%);
        z-index: 0;
      }
      /* Grain estático e determinístico. */
      #grain {
        position: absolute;
        inset: 0;
        z-index: 60;
        pointer-events: none;
        opacity: 0.03;
        background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.82' numOctaves='3' stitchTiles='stitch'/></filter><rect width='220' height='220' filter='url(%23n)'/></svg>");
      }
      #vignette {
        position: absolute;
        inset: 0;
        z-index: 59;
        pointer-events: none;
        background: radial-gradient(
          78% 66% at 50% 48%,
          rgba(0, 0, 0, 0) 58%,
          rgba(0, 0, 0, 0.3) 100%
        );
      }
      .scene {
        position: absolute;
        inset: 0;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="25"
      data-width="1080"
      data-height="1350"
      data-motion-blur="on"
    >
      <div id="ground"></div>

      <div
        id="hook"
        class="clip scene"
        data-composition-id="hook"
        data-composition-src="compositions/hook.html"
        data-start="0"
        data-duration="5.8"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1350"
        style="z-index: 10"
      ></div>

      <div

      <div id="vignette"></div>
      <div id="grain"></div>

      <!-- Desenho de som: cada efeito tem uma causa na tela e está posicionado
           para que o pico medido do arquivo caia um frame depois da imagem.
           Sem trilha musical (nenhum provedor de música neste ambiente) e sem
           locução: a peça é construída para funcionar muda, como o feed do Meta. -->
      <!-- Trilha do cliente. Janela escolhida pela análise: o arquivo entra em
           108,93 s, um tempo forte dentro do breakdown — então os 9,5 s iniciais do
           filme correm sobre o trecho esparso ("início intrigante") e a volta do tema
           em 118,475 s do arquivo cai em 9,55 s do filme, exatamente na primeira
           multiplicação das páginas, que é o que o roteiro pede. -->
      <audio
        id="music"
        class="clip"
        src="assets/bgm/trilha-sonora.mp3"
        data-timeline-role="music"
        data-start="0"
        data-media-start="108.93"
