  <script src="assets/vendor/gsap.min.js"></script>
  <script>
    (function () {
      var FRAME = "06-variantes";
      var r = document.querySelector('[data-composition-id="' + FRAME + '"]');
      var q = function (s) { return r.querySelector(s); };
      var qa = function (s) { return Array.prototype.slice.call(r.querySelectorAll(s)); };

      var world = q(".f06-variantes-world");
      var planes = q(".f06-variantes-planes");
      var mock = q(".f06-variantes-mock");
      var mOld = q(".f06-variantes-mock-old");
      var mNew = q(".f06-variantes-mock-new");
      var cards = qa(".f06-variantes-card");
      var links = qa(".f06-variantes-link");
      var type = q(".f06-variantes-statement");

      // camera: slides 120px right, comes back 40px -> rests at +80 (world x -80)
      var CAM_PEAK = -120;
      var CAM_END = -80;

      // handoff_out host positions; world x compensates the resting camera offset
      var HOST_X = [-330, -110, 110, 330];
      var CARD_X = HOST_X.map(function (v) { return v - CAM_END; }); // -250 / -30 / 190 / 410
      var CARD_Y = 180;        // handoff_out: y +180px
      var CARD_SCALE = 0.82;   // handoff_out: scale 0.82

      // emit beats (match the branch clicks): 0.50 / 0.72 / 0.94 / 1.16
      var EMIT = [0.5, 0.72, 0.94, 1.16];
      var ROT0 = [-7, -3, 3, 7];
      var DASH = [400, 270, 350, 540];

      var tl = gsap.timeline({ paused: true });

      /* ── t = 0 — inherited state (handoff_in) ──────────────────────────────
         landing-mock: x 0, y -300px, scale 0.58, opacity 1, settled;
         lab-planes in perspective.                                           */
      tl.set(world, { x: 0 }, 0);
      tl.set(planes, { opacity: 0.92 }, 0);
      tl.set(mock, { x: 0, y: -300, scale: 0.58, opacity: 1, borderRadius: "20px" }, 0);
      tl.set(mOld, { opacity: 1 }, 0);

      /* ── Cena A (0.0–1.4s) — the branching ────────────────────────────────
         card-morph-anchor: the page morphs down onto its headline (one tween,
         uniform scale + paint-only channels) and emits four variant-cards that
         grow out of that anchor along a curved path, cascading 0.22s apart.   */
      tl.to(mock, {
        scale: 0.335,
        y: -112,
        borderRadius: "47.8px",   // pre-scale: lands the variant-card's apparent 16px
        boxShadow: "0 16px 40px rgba(0,0,0,0.30)",
        opacity: 0.5,
        duration: 0.6,
        ease: "power2.inOut"
      }, 0.3);
      tl.to(mOld, { opacity: 0, duration: 0.24, ease: "power1.in" }, 0.3);
      tl.fromTo(mNew, { opacity: 0 }, { opacity: 1, duration: 0.24, ease: "power1.out" }, 0.66);
      tl.to(planes, { opacity: 0.55, duration: 0.7, ease: "power1.inOut" }, 0.3);

      links.forEach(function (p, i) {
        tl.fromTo(p,
          { strokeDashoffset: DASH[i], opacity: 0 },
          { strokeDashoffset: 0, opacity: 1, duration: 0.32, ease: "power2.out" },
          EMIT[i] - 0.04);
      });

      cards.forEach(function (c, i) {
        var t0 = EMIT[i];
        // x and y ride different durations/eases -> the path bows outward (curved growth)
        tl.fromTo(c, { opacity: 0 }, { opacity: 1, duration: 0.18, ease: "power1.out" }, t0);
        tl.fromTo(c, { y: -200 }, { y: CARD_Y, duration: 0.38, ease: "power2.out" }, t0);
        tl.fromTo(c, { x: 0 }, { x: CARD_X[i], duration: 0.46, ease: "power3.out" }, t0);
        tl.fromTo(c, { scale: 0.3 }, { scale: CARD_SCALE, duration: 0.4, ease: "power2.out" }, t0);
        tl.fromTo(c, { rotation: ROT0[i] }, { rotation: 0, duration: 0.46, ease: "power2.out" }, t0);
      });

      /* ── Cena B (0.4–1.2s) — lateral camera, level 1 + 2 only ─────────────
         Hero typography lives outside .world, so no text ever drifts.        */
      tl.to(world, { x: CAM_PEAK, duration: 0.42, ease: "power2.out" }, 0.4);
      tl.to(world, { x: CAM_END, duration: 0.38, ease: "power2.inOut" }, 0.82);

      /* ── Cena C (0.6–2.7s) — the phrase, one breath, fade + 0.98 -> 1.00 ── */
      tl.fromTo(type,
        { opacity: 0, scale: 0.98 },
        { opacity: 1, scale: 1, duration: 0.56, ease: "power2.out" },
        0.62);

      /* ── Cena D (2.7–3.5s) — hold: nothing tweens after 1.62s ───────────── */

      window.__timelines = window.__timelines || {};
      window.__timelines[FRAME] = tl;
      tl.seek(0);
    })();
  </script>
