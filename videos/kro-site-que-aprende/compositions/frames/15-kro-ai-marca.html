  <script src="assets/vendor/gsap.min.js"></script>
  <script>
    (function () {
      var ID = "15-kro-ai-marca";
      var root = document.querySelector('[data-composition-id="' + ID + '"]');
      if (!root) return;

      var sel = function (s) { return root.querySelector(s); };
      var all = function (s) { return gsap.utils.toArray(root.querySelectorAll(s)); };

      // ── timing ────────────────────────────────────────────────────────────
      // Every tween lands by t = 0.70s, so the final 1.3s (the `hold`) carries
      // zero active tweens — the brand sits absolutely still to the last frame.
      var COLLAPSE_AT = 0.06;
      var COLLAPSE_DUR = 0.40;      // ends 0.46
      var COLLAPSE_EASE = "power3.inOut";
      var POP_AT = 0.22;
      var POP_DUR = 0.48;           // ends 0.70 — spring-pop, ~2% overshoot
      var FADE_DUR = 0.26;          // lockup legible by t = 0.48
      var BLOOM_AT = 0.24;
      var BLOOM_DUR = 0.42;         // ends 0.66
      var BLOOM_MAX = 0.30;

      var sys = sel(".kro15-sys");
      var links = sel(".kro15-links");
      var bloom = sel(".kro15-bloom-core");
      var logo = sel(".kro15-lockup-img");
      var atmo = sel(".kro15-atmo");
      var pad = sel(".kro15-pad");

      var tl = gsap.timeline({ paused: true });

      // ── t = 0 · handoff_in ───────────────────────────────────────────────
      // landing-mock + conversion signal: x 0, y 0, scale 0.96, opacity 1, still.
      tl.set(sys, { x: 0, y: 0, scale: 0.96, opacity: 1, transformOrigin: "50% 50%" }, 0);
      tl.set(atmo, { opacity: 1 }, 0);
      tl.set(links, { scale: 1, opacity: 1, transformOrigin: "50% 50%" }, 0);
      tl.set(bloom, { opacity: 0 }, 0);
      tl.set(logo, { scale: 0.8, opacity: 0, transformOrigin: "50% 50%" }, 0);

      // ── Cena A · the convergence ─────────────────────────────────────────
      // center-outward-expansion, inverted: every interface element starts at its
      // own offset and collapses onto the shared centre, dissolving as it goes.
      all(".kro15-bi").forEach(function (el) {
        tl.fromTo(
          el,
          {
            xPercent: -50,
            yPercent: -50,
            x: Number(el.dataset.targetX),
            y: Number(el.dataset.targetY),
            scale: 1,
            opacity: 1
          },
          {
            xPercent: -50,
            yPercent: -50,
            x: 0,
            y: 0,
            scale: 0.34,
            opacity: 0,
            duration: COLLAPSE_DUR,
            ease: COLLAPSE_EASE
          },
          COLLAPSE_AT
        );
      });

      // the system links collapse with the group
      tl.fromTo(
        links,
        { scale: 1, opacity: 1 },
        { scale: 0.34, opacity: 0, duration: COLLAPSE_DUR, ease: COLLAPSE_EASE },
        COLLAPSE_AT
      );

      // the collapsing system softens as it leaves (Z-blur on one group element)
      tl.fromTo(
        sys,
        { filter: "blur(0px)" },
        { filter: "blur(14px)", duration: COLLAPSE_DUR, ease: COLLAPSE_EASE },
        COLLAPSE_AT
      );

      // the atmosphere switches off too — the ground becomes flat charcoal
      tl.fromTo(
        atmo,
        { opacity: 1 },
        { opacity: 0, duration: COLLAPSE_DUR, ease: "power2.inOut" },
        COLLAPSE_AT
      );

      // ── Cena B · the lockup ──────────────────────────────────────────────
      // spring-pop-entrance, contained: 0.80 -> 1 on back.out(1.7) peaks at
      // ~1.02 (2% overshoot) across 480ms, then rests at exactly scale 1.
      tl.fromTo(
        logo,
        { scale: 0.8 },
        { scale: 1, duration: POP_DUR, ease: "back.out(1.7)" },
        POP_AT
      );
      tl.fromTo(
        logo,
        { opacity: 0 },
        { opacity: 1, duration: FADE_DUR, ease: "power2.out" },
        POP_AT
      );
      tl.fromTo(
        bloom,
        { opacity: 0 },
        { opacity: BLOOM_MAX, duration: BLOOM_DUR, ease: "power2.out" },
        BLOOM_AT
      );

      // ── Cena C · total stability ─────────────────────────────────────────
      // No active tween after 0.70s. This `set` only pads the timeline to the
      // frame's 2s length; the lockup is untouched and absolutely motionless.
      tl.set(pad, { opacity: 0 }, 2);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
      tl.seek(0);
    })();
  </script>
