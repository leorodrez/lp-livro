    <script>
      (function () {
        function build() {
          var gsap = window.gsap;
          var root = document.querySelector('[data-composition-id="05-kro-ai-laboratorio"]');
          if (!gsap || !root) return;
          var q = function (s) { return root.querySelector(s); };
          var qa = function (s) { return Array.prototype.slice.call(root.querySelectorAll(s)); };

          var cam      = q('#f05kro-cam');
          var lab      = q('#f05kro-lab');
          var mockwrap = q('#f05kro-mockwrap');
          var ghostA   = q('#f05kro-ghostA');
          var ghostB   = q('#f05kro-ghostB');
          var hl       = q('#f05kro-hl');
          var hlsh     = q('#f05kro-hlsh');
          var sel      = q('#f05kro-sel');
          var handles  = qa('.f05kro-hd');
          var planes   = qa('.f05kro-plane');
          var links    = qa('.f05kro-link');
          var nodes    = qa('.f05kro-node');
          var fills    = qa('.f05kro-pfill');
          var purple   = q('#f05kro-purple');
          var cyan     = q('#f05kro-cyan');
          var accent   = q('#f05kro-accent');
          var mark     = q('#f05kro-mark');
          var linesA   = qa('.f05kro-a');
          var linesB   = qa('.f05kro-b');
          var emA      = qa('.f05kro-emA');
          var emB      = qa('.f05kro-emB');

          /* ---------- static state (all 3D placement owned by GSAP — never CSS transform) ---------- */
          /* handoff_in: landing-mock at x 0, y +40, scale 0.96, opacity 1, still; ghosts at 0.14 */
          gsap.set(mockwrap, { x: 0, y: 40, scale: 0.96, opacity: 1, transformOrigin: '50% 50%' });
          gsap.set(cam,      { z: 0, rotationX: 0 });
          gsap.set(lab,      { x: 0, y: 0, z: -160 });
          gsap.set(ghostA,   { x: -46, y: -34, z: -34, opacity: 0.14 });
          gsap.set(ghostB,   { x: 52,  y: 38,  z: -62, opacity: 0.14 });
          gsap.set(hl,       { z: 0, scale: 1, transformOrigin: '50% 50%' });
          gsap.set(hlsh,     { opacity: 0 });
          gsap.set(sel,      { opacity: 0 });
          gsap.set(handles,  { scale: 0.4, transformOrigin: '50% 50%' });
          gsap.set(purple,   { opacity: 0.12 });
          gsap.set(cyan,     { opacity: 0.9 });
          gsap.set(accent,   { scaleX: 0, opacity: 1 });
          gsap.set(mark,     { opacity: 0 });
          gsap.set(planes,   { xPercent: -50, yPercent: -50, x: 0, y: 0, z: 0, rotationY: 0, scale: 0.6, opacity: 0, transformOrigin: '50% 50%' });
          gsap.set(fills,    { scaleX: 0 });
          gsap.set(nodes,    { opacity: 0, transformOrigin: '50% 50%' });
          links.forEach(function (p) {
            var L = Number(p.dataset.len);
            gsap.set(p, { strokeDasharray: L, strokeDashoffset: L });
          });
          gsap.set(linesA.concat(linesB), { yPercent: 108, opacity: 0 });

          var tl = gsap.timeline({ paused: true });

          /* ================= CENA A (0.0–0.5s) — a virada: purple assume a dominante ================= */
          tl.to(purple, { opacity: 1, duration: 0.55, ease: 'power2.out' }, 0);
          tl.to(cyan,   { opacity: 0.45, duration: 0.55, ease: 'power2.out' }, 0);
          /* os ghosts do frame anterior GANHAM CORPO em vez de desaparecer */
          tl.to([ghostA, ghostB], { opacity: 0.30, duration: 0.5, ease: 'power2.out' }, 0);
          tl.to(mark, { opacity: 0.18, duration: 0.7, ease: 'power2.out' }, 0.15);

          /* ======== CENA B (0.2–1.8s) — a headline se desprende do plano (spring-pop, overshoot 4%) ======== */
          tl.fromTo(hl, { z: 0 }, { z: 90, duration: 0.62, ease: 'power3.out' }, 0.2);
          tl.fromTo(hl, { scale: 1 }, { scale: 1.04, duration: 0.5, ease: 'power3.out' }, 0.2);
          tl.to(hl, { scale: 1, duration: 0.42, ease: 'power2.inOut' }, 0.7);
          tl.fromTo(hlsh, { opacity: 0 }, { opacity: 1, duration: 0.6, ease: 'power2.out' }, 0.22);
          /* o objeto rigido virou objeto manipulavel */
          tl.fromTo(sel, { opacity: 0 }, { opacity: 1, duration: 0.45, ease: 'power2.out' }, 1.0);
          tl.fromTo(handles, { scale: 0.4 }, { scale: 1, duration: 0.34, ease: 'power3.out', stagger: 0.05 }, 1.05);

          /* ================= CENA C (0.6–2.4s) — dolly-out: a pagina vira parte de um sistema ================= */
          tl.to(cam, { z: -420, rotationX: -6, duration: 1.8, ease: 'power3.out' }, 0.6);
          /* handoff_out: landing-mock em x 0, y -300, scale 0.58, opacity 1, assentada */
          tl.to(mockwrap, { y: -300, scale: 0.58, duration: 1.8, ease: 'power3.out' }, 0.6);

          /* center-outward-expansion: quatro lab-planes se abrem a partir do centro */
          var EXPAND_AT = 0.8, EXPAND_DUR = 1.4, STAGGER = 0.06, EXPAND_EASE = 'power3.out';
          planes.forEach(function (el, i) {
            tl.fromTo(el,
              { xPercent: -50, yPercent: -50, x: 0, y: 0, rotationY: 0, scale: 0.6, opacity: 0 },
              {
                x: Number(el.dataset.targetX),
                y: Number(el.dataset.targetY),
                rotationY: Number(el.dataset.ry),
                scale: 1,
                opacity: 1,
                duration: EXPAND_DUR,
                ease: EXPAND_EASE
              },
              EXPAND_AT + i * STAGGER);
          });

          /* system-links em cyan costuram os planos ao objeto */
          links.forEach(function (p, i) {
            tl.to(p, { strokeDashoffset: 0, duration: 0.85, ease: 'power2.out' }, 1.45 + i * 0.05);
          });
          tl.to(nodes, { opacity: 0.9, duration: 0.4, ease: 'power2.out', stagger: 0.05 }, 1.6);
          /* leitura de potencial (valores de demonstracao de produto) */
          fills.forEach(function (f, i) {
            tl.to(f, { scaleX: Number(f.dataset.fill), duration: 0.6, ease: 'power3.out' }, 1.9 + i * 0.08);
          });

          /* ================= CENA D (1.3–4.0s) — a frase (camera ja parada em 2.4s) ================= */
          tl.to(accent, { scaleX: 1, duration: 0.5, ease: 'power3.out' }, 1.15);

          /* entrada: linha subindo dentro da propria mascara (nunca typewriter) */
          linesA.forEach(function (el, i) {
            tl.fromTo(el, { yPercent: 108, opacity: 0 },
              { yPercent: 0, opacity: 1, duration: 0.58, ease: 'power3.out' }, 1.3 + i * 0.12);
          });
          /* a cor assenta 240ms DEPOIS do fragmento estar legivel em branco */
          tl.to(emA, { color: '#7C3AED', duration: 0.38, ease: 'power1.inOut' }, 2.24);

          linesB.forEach(function (el, i) {
            tl.fromTo(el, { yPercent: 108, opacity: 0 },
              { yPercent: 0, opacity: 1, duration: 0.58, ease: 'power3.out' }, 2.6 + i * 0.12);
          });
          tl.to(emB, { color: '#7C3AED', duration: 0.38, ease: 'power1.inOut' }, 3.54);

          /* ================= CENA E (4.0–5.0s) — hold: o sistema respira, o texto nao ================= */
          tl.to(lab, { y: 0.4, duration: 1.0, ease: 'none' }, 4.0);

          window.__timelines = window.__timelines || {};
          window.__timelines['05-kro-ai-laboratorio'] = tl;
        }

        } else {

      })();
