      position:absolute;
      inset:0;
      width:1080px;

    /* ═══ LEVEL 1 — atmospheric ground (full-bleed on a clip layer) ═══════ */

      position:absolute; inset:0;
      background:
        radial-gradient(118% 82% at 16% 8%,  rgba(255,255,255,0.055) 0%, rgba(255,255,255,0.0) 54%),

    .f08-grain{

    /* ═══ LEVEL 2 — the system, inside perspective ════════════════════════ */
    .f08-sys{ position:absolute; inset:0; }
    .f08-cam-outer{                 /* SCALE only (coordinate-target-zoom: outer scales) */
      position:absolute; inset:0;
      transform-origin:50% 50%;
      will-change:transform;
    }
    .f08-cam-inner{                 /* TRANSLATE only (counter-shift)                   */
      position:absolute; inset:0;
      will-change:transform;
    }
    .f08-stage{
      position:absolute; inset:0;
      perspective:2400px;
      perspective-origin:50% 60%;
    }
    .f08-deck{
      position:absolute; inset:0;

    }

    /* variant column = signal-counter + variant-card + potential-bar */
    .f08-vcol{
      --dof:0px;
      position:absolute;
      left:50%; top:50%;
      width:200px; height:378px;
      margin-left:-100px; margin-top:-189px;
      transform-style:preserve-3d;
    }
    .f08-vinner{
      position:absolute; inset:0;

    }

    .f08-counter{

    .f08-chrome{ position:absolute; left:0; top:0; width:200px; height:26px; border-bottom:1px solid rgba(43,43,43,0.08); }
    .f08-cdot{ position:absolute; top:11px; width:5px; height:5px; border-radius:50%; background:rgba(43,43,43,0.22); }

    /* potential-bar */
    .f08-track{

    /* short-radius focus glow on the variant that gains spatial priority.

    /* data converging on the prioritised variant */

  </style>

  <script>
    (function () {
      var FRAME = "08-fazem-agir";
      var W = 1080, H = 1920, DUR = 3.5;

      /* ── frame geometry ─────────────────────────────────────────────── */
      var BASE_Y = 200;        /* column row sits below stage centre       */
      var BASE_SCALE = 0.82;   /* inherited row scale (handoff_in)         */
      var FOCAL = 1;           /* variant-card #2 — the one that responds  */
      var ENTRY_Y = 957;       /* canvas y where a signal is absorbed      */
      var SIG_START_Y = 790;   /* signals stay clear of the hero type      */
      var SIG_TRAVEL = 0.38;

      /* product-UI demo values — never a promise, never a result claim */
      var COLS = [
        { x: -330, z0:    0, z1: -120, c0: 18, c1: 47, f0: 0.30, f1: 0.52, at: 0.34, dur: 1.22, lit: 3, arrive: 3 },
        { x: -110, z0:  -90, z1:    0, c0: 24, c1: 96, f0: 0.34, f1: 0.86, at: 0.26, dur: 1.44, lit: 4, arrive: 6 },
        { x:  110, z0: -180, z1: -300, c0: 21, c1: 78, f0: 0.31, f1: 0.74, at: 0.42, dur: 1.30, lit: 3, arrive: 5 },
        { x:  330, z0: -270, z1: -420, c0: 11, c1: 19, f0: 0.16, f1: 0.21, at: 0.50, dur: 0.74, lit: 2, arrive: 1 }
      ];
      var LANES = [-26, 10, -8, 26, -16, 20];

      /* ── build the resident signal grid on each variant surface ─────── */
      var FIELD_COLS = 6, FIELD_PITCH_X = 26, FIELD_ROWS_Y = [0, 24];
      var residents = [];
      for (var ci = 0; ci < COLS.length; ci++) {
        var field = document.getElementById("f08-field-" + ci);
        var list = [];
        for (var s = 0; s < FIELD_COLS * FIELD_ROWS_Y.length; s++) {
          var d = document.createElement("div");
          d.className = "f08-res";
          d.style.left = (s % FIELD_COLS) * FIELD_PITCH_X + "px";
          d.style.top = FIELD_ROWS_Y[Math.floor(s / FIELD_COLS)] + "px";
          field.appendChild(d);
          list.push(d);
        }
        residents.push(list);
      }

      /* ── build the travelling signals (deterministic schedule) ──────── */
      var sigLayer = document.getElementById("f08-signals");
      var SIGNALS = [];
      for (var ci2 = 0; ci2 < COLS.length; ci2++) {
        var c = COLS[ci2];
        for (var k = 0; k < c.arrive; k++) {
          var arriveT = c.at + c.dur * ((k + 0.8) / c.arrive);
          var el = document.createElement("div");
          el.className = "f08-sig";
          el.innerHTML = "<i></i>";
          el.style.left = (W / 2 + c.x - 4.5 + LANES[k % LANES.length]) + "px";
          el.style.top = (ENTRY_Y - 4.5) + "px";
          sigLayer.appendChild(el);
          SIGNALS.push({
            el: el,
            res: residents[ci2][c.lit + k],
            arriveT: arriveT,
            startT: Math.max(0.06, arriveT - SIG_TRAVEL)
          });
        }
      }

      /* ── initial state = handoff_in (parallel planes, still) ────────── */
      for (var ci3 = 0; ci3 < COLS.length; ci3++) {
        var cc = COLS[ci3];
        gsap.set("#f08-col-" + ci3, {
          x: cc.x, y: BASE_Y, z: cc.z0, scale: BASE_SCALE, opacity: 1, "--dof": "0px"
        });
        gsap.set("#f08-count-" + ci3, { scale: 1 });
        gsap.set("#f08-fill-" + ci3, { scaleX: cc.f0 });
        document.getElementById("f08-count-" + ci3).textContent = String(cc.c0);
        for (var r = 0; r < residents[ci3].length; r++) {
          gsap.set(residents[ci3][r], { opacity: r < cc.lit ? 1 : 0, scale: r < cc.lit ? 1 : 0.4 });
        }
      }
      gsap.set("#f08-cam-outer", { scale: 1 });
      gsap.set("#f08-cam-inner", { x: 0, y: 0 });
      gsap.set("#f08-glow", { opacity: 0 });
      gsap.set("#f08-type", { opacity: 0, scaleY: 0.94 });
      gsap.set(".f08-conv", { strokeDashoffset: 100 });
      for (var si = 0; si < SIGNALS.length; si++) {
        gsap.set(SIGNALS[si].el, { y: -(ENTRY_Y - SIG_START_Y), opacity: 0 });
      }

      /* ── one paused timeline ────────────────────────────────────────── */
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      /* ══ CENA A (0.0–2.0s) — os sinais se acumulam de forma desigual ══
         counting-dynamic-scale (value + transform scale, shared ease) and
         stat-bars-and-fills (scaleX from a left origin, same window).     */
      for (var i = 0; i < COLS.length; i++) {
        (function (cfg, idx) {
          var node = document.getElementById("f08-count-" + idx);
          var proxy = { v: cfg.c0 };
          var START_SCALE = 0.88;          /* START_SIZE / END_SIZE */
          tl.to(proxy, {
            v: cfg.c1,
            duration: cfg.dur,
            ease: "power2.out",
            onUpdate: function () { node.textContent = String(Math.round(proxy.v)); }
          }, cfg.at);
          tl.fromTo(node,
            { scale: START_SCALE },
            { scale: 1, duration: cfg.dur, ease: "power2.out" }, cfg.at);
          tl.fromTo("#f08-fill-" + idx,
            { scaleX: cfg.f0 },
            { scaleX: cfg.f1, duration: cfg.dur, ease: "power2.out" }, cfg.at);
        })(COLS[i], i);
      }

      for (var j = 0; j < SIGNALS.length; j++) {
        var sg = SIGNALS[j];
        tl.fromTo(sg.el,
          { y: -(ENTRY_Y - SIG_START_Y) },
          { y: 0, duration: SIG_TRAVEL, ease: "power1.in" }, sg.startT);
        tl.fromTo(sg.el,
          { opacity: 0 },
          { opacity: 1, duration: SIG_TRAVEL * 0.34, ease: "none" }, sg.startT);
        tl.to(sg.el,
          { opacity: 0, duration: SIG_TRAVEL * 0.22, ease: "none" }, sg.startT + SIG_TRAVEL * 0.78);
        tl.fromTo(sg.res,
          { opacity: 0, scale: 0.4 },
          { opacity: 1, scale: 1, duration: 0.26, ease: "back.out(1.6)" }, Math.max(0, sg.arriveT - 0.04));
      }

      /* ══ CENA C (0.4–2.3s) — a frase, em um fôlego ════════════════════
         vertical scale from the baseline, 0.94 → 1.00, 520ms.             */
      tl.fromTo("#f08-type",
        { opacity: 0, scaleY: 0.94 },
        { opacity: 1, scaleY: 1, duration: 0.52, ease: "power2.out" }, 0.40);

      /* ══ CENA B (1.52–2.42s) — a aproximação ══════════════════════════
         coordinate-target-zoom, nested wrappers: outer scales, inner
         counter-translates. Focal column's own END offset from canvas
         centre is o = (-40, +120) (its handoff_out). Desired landing
         offset d = (0, +136) — low-centre, so the hero typography above
         stays untouched. T = d / S - o = (40, 136/1.12 - 120) ≈ (40, 1).  */
      var ZOOM_AT = 1.52, ZOOM_DUR = 0.90, ZOOM_EASE = "power3.inOut";
      var ZOOM_SCALE = 1.12;                 /* target ≈ 224px wide ≪ 0.88·W */
      var COUNTER_X = 40, COUNTER_Y = 1;

      tl.fromTo("#f08-cam-outer",
        { scale: 1 },
        { scale: ZOOM_SCALE, duration: ZOOM_DUR, ease: ZOOM_EASE }, ZOOM_AT);
      tl.fromTo("#f08-cam-inner",
        { x: 0, y: 0 },
        { x: COUNTER_X, y: COUNTER_Y, duration: ZOOM_DUR, ease: ZOOM_EASE }, ZOOM_AT);

      /* spatial priority — the focal variant comes forward. No badge. */
      tl.fromTo("#f08-col-" + FOCAL,
        { x: COLS[FOCAL].x, y: BASE_Y, z: COLS[FOCAL].z0, scale: BASE_SCALE },
        { x: -40, y: 120, z: COLS[FOCAL].z1, scale: 0.94, duration: ZOOM_DUR, ease: ZOOM_EASE }, ZOOM_AT);

      /* depth-of-field-blur — the other three defocus and recede */
      for (var m = 0; m < COLS.length; m++) {
        if (m === FOCAL) continue;
        tl.fromTo("#f08-col-" + m,
          { opacity: 1, "--dof": "0px", z: COLS[m].z0 },
          { opacity: 0.45, "--dof": "4px", z: COLS[m].z1, duration: ZOOM_DUR, ease: "power2.inOut" }, ZOOM_AT);
      }

      /* os dados convergem para ela por linhas cyan */
      var convs = document.querySelectorAll(".f08-conv");
      for (var p = 0; p < convs.length; p++) {
        tl.fromTo(convs[p],
          { strokeDashoffset: 100 },
          { strokeDashoffset: 0, duration: 0.70, ease: "power2.out" }, 1.60 + p * 0.06);
      }

      /* short-radius glow on the active variant (frame.md: only the
         element that is active right now, opacity ≤ 0.5) */
      tl.fromTo("#f08-glow",
        { opacity: 0 },
        { opacity: 0.42, duration: 0.68, ease: "power2.out" }, 1.68);

      /* emphasis — "agir" settles into cyan on already-legible white text */
      tl.fromTo("#f08-agir",
        { color: "#FFFFFF" },
        { color: "#06B6D4", duration: 0.26, ease: "power1.inOut" }, 2.00);

      /* ══ CENA D (2.42–3.5s) — hold. Nothing moves. ════════════════════ */
      tl.to({ _p: 0 }, { _p: 1, duration: DUR, ease: "none" }, 0);

      window.__timelines[FRAME] = tl;
      tl.seek(0);
    })();
  </script>
