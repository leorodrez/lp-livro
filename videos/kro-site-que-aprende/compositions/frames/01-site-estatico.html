        var S0 = 1.14;
        var TEXT_OFFSET_Y = 202;      // text block centre - viewport centre
        var ANCHOR_W = 0.34;
        var CAM_Y0 = -TEXT_OFFSET_Y * ANCHOR_W * S0;   // = -78.3px

        var world = document.getElementById("f01-world");
        var cam = { scale: S0, x: 0, y: CAM_Y0 };
        function applyCamera() {
          world.style.transform =
            "translate(" + cam.x + "px, " + cam.y + "px) scale(" + cam.scale + ")";
        }
        applyCamera(); // seed frame 0

        tl.fromTo(
          cam,
          { scale: S0, y: CAM_Y0 },
          {
            scale: 1,
            y: 0,
            duration: 0.8,
            ease: "power3.out",
            onUpdate: applyCamera
          },
          0
        );
        /* The camera is completely still from t = 0.8s onward and never
           moves again. The landing-mock has NO animated property at all —
           the absence of movement is the content of the frame. */

        /* =====================================================
           CENA B (0.32-1.52s) — o sistema se mexe, a pagina nao.
           waterfall-entry: BINARY opacity via tl.set, whip from
           below on power4.out, gaps SHRINK across the cascade,
           travel/duration vary by weight.
           ===================================================== */
        // seed version 1 visible, every later version hidden (seek-safe)
        tl.set(
          ["#f01-ad1-v1", "#f01-ad2-v1", "#f01-ad3-v1", "#f01-ad4-v1", "#f01-ad5-v1", "#f01-hero-v1"],
          { opacity: 1, y: 0 },
          0
        );
        tl.set(
          [
            "#f01-ad1-v2", "#f01-ad2-v2", "#f01-ad3-v2", "#f01-ad4-v2", "#f01-ad5-v2", "#f01-hero-v2",
            "#f01-ad1-v3", "#f01-ad3-v3", "#f01-ad5-v3"
          ],
          { opacity: 0, y: 0 },
          0
        );

        // diagonal cascade: top-right -> right -> top-left -> left -> hero -> far-left
        var swap = [
          { out: "#f01-ad2-v1", into: "#f01-ad2-v2", t: 0.320, y: 46, d: 0.15 },
          { out: "#f01-ad4-v1", into: "#f01-ad4-v2", t: 0.415, y: 44, d: 0.15 },
          { out: "#f01-ad1-v1", into: "#f01-ad1-v2", t: 0.503, y: 48, d: 0.16 },
          { out: "#f01-ad3-v1", into: "#f01-ad3-v2", t: 0.584, y: 42, d: 0.14 },
          { out: "#f01-hero-v1", into: "#f01-hero-v2", t: 0.659, y: 70, d: 0.18 }, // anchor: heaviest
          { out: "#f01-ad5-v1", into: "#f01-ad5-v2", t: 0.728, y: 34, d: 0.12 }    // lightest: snaps
        ];
        for (var i = 0; i < swap.length; i++) {
          var s = swap[i];
          tl.set(s.out, { opacity: 0 }, s.t);
          tl.set(s.into, { opacity: 1, y: s.y }, s.t);
          tl.to(s.into, { y: 0, duration: s.d, ease: "power4.out" }, s.t);
        }

        // metric-readouts pulse (explicit sequential tweens — no repeat/yoyo)
        var pulses = [
          { el: "#f01-m1", t: 0.38 },
          { el: "#f01-m2", t: 0.54 },
          { el: "#f01-m1", t: 0.92 },
          { el: "#f01-m2", t: 1.06 }
        ];
        tl.set(["#f01-m1", "#f01-m2"], { opacity: 0.68 }, 0);
        for (var p = 0; p < pulses.length; p++) {
          tl.fromTo(
            pulses[p].el,
            { opacity: 0.68 },
            { opacity: 1, duration: 0.2, ease: "sine.out" },
            pulses[p].t
          );
          tl.to(pulses[p].el, { opacity: 0.68, duration: 0.26, ease: "sine.in" }, pulses[p].t + 0.2);
        }

        /* =====================================================
           CENA C (1.0-4.5s) — a frase constroi em tres respiracoes.
           Entrance for this frame: MASK-REVEAL FROM BELOW, 520ms.
           The camera is already parked, so nothing drifts, blurs or
           moves while the viewer is reading.
           ===================================================== */
        var REVEAL = 0.52;
        function maskReveal(sel, at) {
          tl.fromTo(
            sel,
            { yPercent: 118, opacity: 1 },
            { yPercent: 0, duration: REVEAL, ease: "power3.out" },
            at
          );
        }
        // respiracao 1 — "Se o seu site diz exatamente a mesma coisa"
        maskReveal("#f01-l1", 1.00);
        maskReveal("#f01-l2", 1.14);
        // respiracao 2 — "ha seis meses,"
        maskReveal("#f01-l3", 2.30);
        // respiracao 3 — "existe um problema."
        maskReveal("#f01-l4", 3.40);

        /* =====================================================
           CENA D (3.02-4.44s) — destaque semantico.
           Colour lands AFTER the fragment is already legible in
           white (+200ms / +180ms), as a 340ms cross-fade settling
           onto stable text. No glow, no filled background.
           ===================================================== */
        tl.fromTo(
          "#f01-em1",
          { color: "#FFFFFF" },
          { color: "#D8C0A7", duration: 0.34, ease: "sine.inOut" },
          3.02   // "seis meses" legible at 2.82 + 0.20
        );
        tl.fromTo(
          "#f01-em2",
          { color: "#FFFFFF" },
          { color: "#D8C0A7", duration: 0.34, ease: "sine.inOut" },
          4.10   // "problema" legible at 3.92 + 0.18 -> settles 4.44, before the hold
        );

        /* =====================================================
           CENA E (4.5-6.0s) — o hold.
           Typography and camera dead still. Only the peripheral,
           out-of-focus ad-cards keep swapping, very slowly
           (opacity only — no movement anywhere near the text).
           ===================================================== */
        var slow = [
          { out: "#f01-ad1-v2", into: "#f01-ad1-v3", t: 4.62 },
          { out: "#f01-ad3-v2", into: "#f01-ad3-v3", t: 4.84 },
          { out: "#f01-ad5-v2", into: "#f01-ad5-v3", t: 5.06 }
        ];
        for (var k = 0; k < slow.length; k++) {
          tl.to(slow[k].out, { opacity: 0, duration: 0.5, ease: "sine.inOut" }, slow[k].t);
          tl.fromTo(
            slow[k].into,
            { opacity: 0 },
            { opacity: 1, duration: 0.5, ease: "sine.inOut" },
            slow[k].t
          );
        }

        /* --- handoff_out: ad-card-hero breaks out of the cluster and
               sweeps the foreground to the left, delivering the cut.
               At t = 6.00 exactly: x -640, y +520, scale 1.18,
               opacity 1, still travelling left, 18px motion-blur trail. --- */
        tl.set("#f01-hero-sweep", { x: 300, y: 520, scale: 1, opacity: 1 }, 0);

        // 5.52-5.70 — "se destaca do grupo": comes into focus
        tl.fromTo(
          "#f01-hero-blur",
          { filter: "blur(6px)" },
          { filter: "blur(0px)", duration: 0.18, ease: "power2.out" },
          5.52
        );

        // 5.70-6.00 — constant-velocity leftward sweep (ease "none" so the
        // seam is handed over at speed, with no deceleration at the cut)
        tl.fromTo(
          "#f01-hero-sweep",
          { x: 300, y: 520, scale: 1, opacity: 1 },
          { x: -640, y: 520, scale: 1.18, opacity: 1, duration: 0.3, ease: "none" },
          5.70
        );
        tl.fromTo(
          "#f01-hero-trail",
          { opacity: 0, scaleX: 1 },
          { opacity: 0.52, scaleX: 2.6, duration: 0.3, ease: "none" },
          5.70
        );

        window.__timelines["01-site-estatico"] = tl;
        tl.pause(0);
      }

      if (window.gsap) {
        buildFrame01();
      } else {
        var loader = document.querySelector('script[src*="gsap"]');
        if (loader) loader.addEventListener("load", buildFrame01);
      }
    })();
  </script>
</template>
