           L2 at 0.6x nominal, L1 at 0.25x. L3 typography never moves.
           ════════════════════════════════════════════════════════════════ */
        tl.fromTo(stage,      { x: 60 }, { x: 0, duration: 0.52, ease: "power2.inOut" }, 0);
        tl.fromTo(groundMove, { x: 15 }, { x: 0, duration: 0.52, ease: "power2.inOut" }, 0);
        tl.fromTo(stage,      { y: 0 }, { y: -48, duration: 0.56, ease: "power2.inOut", immediateRender: false }, 4.0);
        tl.fromTo(groundMove, { y: 0 }, { y: -12, duration: 0.56, ease: "power2.inOut", immediateRender: false }, 4.0);

        /* ════════════════════════════════════════════════════════════════
           TEXT — the four phrases of onscreen_text, verbatim and in order.
           Seams are cut-the-curve (whole-line variant), rightward on both
           sides, matching the anchor's own rightward arrival.
           ════════════════════════════════════════════════════════════════ */
        var CUT_D = 230;
        function phraseIn(el, at, dur, fromOp) {
          tl.fromTo(
            el,
            { x: -CUT_D, opacity: fromOp },
            { x: 0, opacity: 1, duration: dur, ease: "power4.out", immediateRender: at === 0.16 },
            at
          );
        }
        function phraseOut(el, at) {
          tl.fromTo(el, { x: 0 }, { x: CUT_D, duration: 0.26, ease: "power4.in", immediateRender: false }, at);
          tl.fromTo(el, { opacity: 1 }, { opacity: 0, duration: 0.22, ease: "power1.in", immediateRender: false }, at);
        }

        /* ╔══ SCENE A (0.0–2.0) — "Você muda seus anúncios." ══╗ */
        /* handoff_in: ad-card-hero, exact boundary state */
        tl.fromTo(
          card,
          { x: -640, y: 520, scale: 1.18, opacity: 1 },
          { x: 0, y: 0, scale: 1, opacity: 1, duration: 0.52, ease: "power3.out" },
          0
        );
        phraseIn(phrases[0], 0.16, 0.46, 0);

        /* scale-swap-transition — the creative changes version, not identity */
        tl.fromTo(verA, { scale: 1, opacity: 1 },
          { scale: 0.72, opacity: 0, duration: 0.30, ease: "power2.in", immediateRender: false }, 0.46);
        tl.fromTo(verB, { scale: 0.72, opacity: 0 },
          { scale: 1, opacity: 1, duration: 0.48, ease: "back.out(1.5)", immediateRender: false }, 0.62);
        /* still 1.10 → 1.74 (hold 0.6s) */
        phraseOut(phrases[0], 1.74);

        /* ╔══ SCENE B (2.0–4.0) — "Testa novos criativos." ══╗ */
        phraseIn(phrases[1], 2.0, 0.32, 0.35);
        /* organised multiplication, cascade stagger 0.08s */
        var varAt = [2.22, 2.30, 2.38];
        for (var i = 0; i < 3; i++) {
          tl.fromTo(
            vars[i],
            { opacity: 0, y: 30, scale: 0.90 },
            { opacity: 1, y: 0, scale: 1, duration: 0.40, ease: "power3.out" },
            varAt[i]
          );
        }
        /* collapse into one dominant composition — losers lose priority */
        tl.fromTo(vars[0], { scale: 1, opacity: 1, x: 0 },
          { scale: 0.90, opacity: 0.34, x: 16, duration: 0.28, ease: "power2.inOut", immediateRender: false }, 2.86);
        tl.fromTo(vars[2], { scale: 1, opacity: 1, x: 0 },
          { scale: 0.90, opacity: 0.34, x: -16, duration: 0.28, ease: "power2.inOut", immediateRender: false }, 2.86);
        tl.fromTo(vars[1], { scale: 1 },
          { scale: 1.06, duration: 0.28, ease: "power2.inOut", immediateRender: false }, 2.86);
        tl.fromTo(glow, { opacity: 0 },
          { opacity: 1, duration: 0.28, ease: "power2.out", immediateRender: false }, 2.86);
        /* still 3.14 → 3.74 (hold 0.6s) */
        phraseOut(phrases[1], 3.74);

        /* ╔══ SCENE C (4.0–6.0) — "Ajusta campanhas." ══╗ */
        phraseIn(phrases[2], 4.0, 0.32, 0.35);
        tl.fromTo(pSlider,  { opacity: 0, y: 22 }, { opacity: 1, y: 0, duration: 0.38, ease: "power3.out" }, 4.20);
        tl.fromTo(pStepper, { opacity: 0, y: 22 }, { opacity: 1, y: 0, duration: 0.38, ease: "power3.out" }, 4.32);
        /* the handle slides and settles; the control is coupled to its target */
        tl.fromTo(handle,    { x: 20 }, { x: 212, duration: 0.34, ease: "power3.out", immediateRender: false }, 4.70);
        tl.fromTo(trackFill, { scaleX: 0.144 }, { scaleX: 0.654, duration: 0.34, ease: "power3.out", immediateRender: false }, 4.70);
        tl.fromTo(link,      { opacity: 0 }, { opacity: 0.45, duration: 0.26, ease: "power2.out", immediateRender: false }, 4.74);
        /* the stepper steps */
        tl.fromTo(stepPlus, { scale: 1 }, { scale: 0.90, duration: 0.08, ease: "power2.in", immediateRender: false }, 4.82);
        tl.fromTo(stepPlus, { scale: 0.90 }, { scale: 1, duration: 0.16, ease: "power2.out", immediateRender: false }, 4.90);
        tl.fromTo(stepA, { opacity: 1 }, { opacity: 0, duration: 0.06, ease: "none", immediateRender: false }, 4.90);
        tl.fromTo(stepB, { opacity: 0 }, { opacity: 1, duration: 0.06, ease: "none", immediateRender: false }, 4.90);
        /* and the card responds — the budget bar follows */
        tl.fromTo(budgetFill, { scaleX: 0.34 }, { scaleX: 0.68, duration: 0.28, ease: "power3.out" }, 4.86);
        tl.fromTo(budgetHead, { x: 205 }, { x: 420, duration: 0.28, ease: "power3.out" }, 4.86);
        /* still 5.14 → 5.74 (hold 0.6s) */
        phraseOut(phrases[2], 5.74);

        /* ╔══ SCENE D (6.0–9.0) — "Analisa CPC, leads e vendas." ══╗ */
        phraseIn(phrases[3], 6.0, 0.34, 0.35);
        var mAt = [6.02, 6.14, 6.26];
        for (var j = 0; j < 3; j++) {
          tl.fromTo(metrics[j], { opacity: 0, y: 26 },
            { opacity: 1, y: 0, duration: 0.32, ease: "power3.out" }, mAt[j]);
        }

        /* counting-dynamic-scale — 900ms run, parallel chord, stops for reading */
        var COUNT_AT = 6.30, COUNT_DUR = 0.90, COUNT_EASE = "power3.out";
        var START_SCALE = 30 / 54;

        var sCpc = { v: 0 }, sLeads = { v: 0 }, sVendas = { v: 0 };
        tl.fromTo(sCpc, { v: 0 }, {
          v: 1.84, duration: COUNT_DUR, ease: COUNT_EASE,
          onUpdate: function () { valCpc.textContent = sCpc.v.toFixed(2).replace(".", ","); }
        }, COUNT_AT);
        tl.fromTo(sLeads, { v: 0 }, {
          v: 248, duration: COUNT_DUR, ease: COUNT_EASE,
          onUpdate: function () { valLeads.textContent = String(Math.round(sLeads.v)); }
        }, COUNT_AT);
        tl.fromTo(sVendas, { v: 0 }, {
          v: 37, duration: COUNT_DUR, ease: COUNT_EASE,
          onUpdate: function () { valVendas.textContent = String(Math.round(sVendas.v)); }
        }, COUNT_AT);
        for (var k = 0; k < 3; k++) {
          tl.fromTo(mrows[k], { scale: START_SCALE },
            { scale: 1, duration: COUNT_DUR, ease: COUNT_EASE }, COUNT_AT);
        }
        /* one discrete pulse per indicator */
        var pAt = [6.40, 6.70, 7.00];
        for (var m = 0; m < 3; m++) {
          tl.fromTo(pulses[m], { scale: 0.40, opacity: 0.25 },
            { scale: 1, opacity: 1, duration: 0.20, ease: "power2.out" }, pAt[m]);
        }

        /* ── absolute stillness 7.20 → 8.40 (hold 1.2s) ── */

        /* handoff_out — at 8.40 the whole set keeps x 0 / y 0 / scale 1 / opacity 1
           and begins to liquefy into flows. Nothing exits; the next frame finishes it. */
        tl.fromTo(flows, { opacity: 0 },
          { opacity: 1, duration: 0.40, ease: "power2.out", immediateRender: false }, 8.40);
        tl.fromTo(flows, { x: -34 },
          { x: 34, duration: 0.60, ease: "power1.inOut", immediateRender: false }, 8.40);
        tl.fromTo(card, { borderRadius: 16, borderColor: "rgba(255,255,255,0.10)" },
          { borderRadius: 56, borderColor: "rgba(6,182,212,0.30)", duration: 0.60, ease: "power2.in", immediateRender: false }, 8.40);
        for (var s = 1; s < surfaces.length; s++) {
          tl.fromTo(surfaces[s], { borderRadius: 12, borderColor: "rgba(255,255,255,0.10)" },
            { borderRadius: 44, borderColor: "rgba(6,182,212,0.26)", duration: 0.60, ease: "power2.in", immediateRender: false }, 8.40);
        }
        for (var b = 0; b < softBars.length; b++) {
          tl.fromTo(softBars[b], { scaleY: 1, scaleX: 1 },
            { scaleY: 0.42, scaleX: 1.05, duration: 0.60, ease: "power2.in", immediateRender: false }, 8.40);
        }
      }

      window.__timelines["02-voce-otimiza-tudo"] = tl;
      tl.seek(0);
    })();
  </script>
