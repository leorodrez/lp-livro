  <script src="assets/vendor/gsap.min.js"></script>
  <script>
    (function () {
      var FRAME = "04-mensagens-fantasma";
      var scope = document.querySelector('[data-composition-id="' + FRAME + '"]') || document;
      var q = function (sel) { return scope.querySelector(sel); };

      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      /* ── Cena A (0.0–4.3s) — viewport-change: the slow push-in ──────────
         Single-wrapper composite camera: translate(x,y) scale(S), composed in
         ONE place from the cam object. It carries the landing-mock handoff
         contract verbatim:
           handoff_in  @ t=0   → x 0, y +40px, scale 0.88, opacity 1
           handoff_out @ t=5.5 → x 0, y +40px, scale 0.96, opacity 1, still
         The push LANDS at 4.3s, so the whole 1.2s hold window is dead still
         and nothing ever moves while the sentence is being read.           */
      var world = q(".f04mf-world");
      var cam = { scale: 0.88, x: 0, y: 40 };
      function applyCamera() {
        if (!world) return;
        world.style.transform =
          "translate(" + cam.x + "px, " + cam.y + "px) scale(" + cam.scale + ")";
      }
      applyCamera(); /* seed frame 0 */

      tl.fromTo(
        cam,
        { scale: 0.88 },
        { scale: 0.96, duration: 4.3, ease: "power1.inOut", onUpdate: applyCamera },
        0
      );

      /* ── Cena B (0.3–2.48s) — the sentence, built in two breaths ────────
         This frame's entrance: short 24px vertical displacement + fade,
         480ms. Each breath arrives as one unit, then never moves again.    */
      tl.fromTo(
        q(".f04mf-accent"),
        { opacity: 0, scaleX: 0.18 },
        { opacity: 0.5, scaleX: 1, duration: 0.42, ease: "power2.out" },
        0.15
      );
      tl.fromTo(
        q(".f04mf-breath-1"),
        { opacity: 0, y: 24 },
        { opacity: 1, y: 0, duration: 0.48, ease: "power2.out" },
        0.3
      );
      tl.fromTo(
        q(".f04mf-breath-2"),
        { opacity: 0, y: 24 },
        { opacity: 1, y: 0, duration: 0.48, ease: "power2.out" },
        2.0
      );

      /* ── Cena C (1.4–3.28s) — the ghosts (depth-of-field-blur) ──────────
         Cascade, stagger 0.22s. Each untested variant recedes into its own
         depth plane while fading to its ceiling opacity and settling at its
         depth blur — derived per layer, so the falloff is identical on every
         seek. Nothing ever exceeds 0.14; the hero type stays --dof: 0.      */
      var ghosts = [
        { sel: ".f04mf-g1", op: 0.14, blur: 3, z: -110, at: 1.40, dur: 1.20 },
        { sel: ".f04mf-g2", op: 0.10, blur: 5, z: -230, at: 1.62, dur: 1.32 },
        { sel: ".f04mf-g3", op: 0.07, blur: 7, z: -360, at: 1.84, dur: 1.44 }
      ];
      ghosts.forEach(function (g) {
        var el = q(g.sel);
        if (!el) return;
        tl.fromTo(
          el,
          { opacity: 0, z: g.z + 150, "--dof": (g.blur * 0.45).toFixed(2) + "px" },
          {
            opacity: g.op,
            z: g.z,
            "--dof": g.blur + "px",
            duration: g.dur,
            ease: "power2.out"
          },
          g.at
        );
      });

      /* ── Cena D (4.3–5.5s) — the hold. No tween lives past 4.3s. ─────── */

      window.__timelines[FRAME] = tl;
    })();
  </script>
