  <script>
    (function () {
      var root = document.querySelector('[data-composition-id="03-trafego-congela"]');
      if (!root) { return; }

      var q = function (sel) { return root.querySelector(sel); };
      var qa = function (sel) { return Array.prototype.slice.call(root.querySelectorAll(sel)); };

      /* ── the single camera state + its one writer ────────────────────────── */
      var PERSP = 2400;
      var CAM_LAND_Z = 380;                              /* the landed pose */
      var MAG = PERSP / (PERSP - CAM_LAND_Z);            /* 1.188119 */

      var world = q("#f03-trafego-world");
      var cam = { z: 0, rotX: 0, y: 0 };
      function applyCamera() {
        world.style.transform =
          "translate3d(0px," + cam.y.toFixed(3) + "px," + cam.z.toFixed(3) + "px) rotateX(" + cam.rotX.toFixed(3) + "deg)";
      }
      applyCamera();

      /* camera-travel motion blur — rides the wrapper OUTSIDE the perspective
         container so it never flattens preserve-3d, and never touches level 3 */
      var blurBox = q("#f03-trafego-blur");
      var fx = { blur: 0 };
      function applyBlur() {
        blurBox.style.filter = fx.blur < 0.05 ? "none" : "blur(" + fx.blur.toFixed(2) + "px)";
      }
      applyBlur();

      /* ── level-2 geometry handed to frame 04 ────────────────────────────── */
      /* handoff_out asks for an APPARENT x 0 / y +40px / scale 0.88 on the
         landing-mock. The landed camera magnifies the world by MAG, so the
         element-space values are the apparent ones divided by MAG. */
      var mock = q("#f03-trafego-mock");
      var MOCK_REST_SCALE = 0.88 / MAG;                  /* 0.74067 */
      var MOCK_REST_Y = 40 / MAG;                        /* 33.667 */

      /* ── svg-path-draw setup: measured geometry, never guessed ──────────── */
      var lines = qa(".f03-trafego-flow-line");
      var heads = qa(".f03-trafego-flow-head");
      var lineLen = [];
      var headLen = [];
      var HEAD_DASH = 64;

      lines.forEach(function (p) {
        var len = p.getTotalLength() * 1.02;
        lineLen.push(len);
        p.style.strokeDasharray = len.toFixed(2);
        p.style.strokeDashoffset = len.toFixed(2);
      });
      heads.forEach(function (p) {
        var len = p.getTotalLength();
        headLen.push(len);
        /* pattern period = HEAD_DASH + 2*len, so exactly one travelling dash */
        p.style.strokeDasharray = HEAD_DASH + " " + (2 * len).toFixed(2);
        p.style.strokeDashoffset = (HEAD_DASH + 2 * len).toFixed(2);
        p.style.opacity = "0";
      });

      /* ── the hero typography wipes (mask-wipe, this frame's own entrance) ── */
      function wipeState(el, st) {
        el.style.clipPath = "inset(" + st.insA.toFixed(3) + "% -7% " + st.insB.toFixed(3) + "% -7%)";
      }
      var p1 = q("#f03-trafego-p1");
      var p2 = q("#f03-trafego-p2");
      var w1 = { insA: 0, insB: 100 };
      var w2 = { insA: 0, insB: 100 };
      wipeState(p1, w1);
      wipeState(p2, w2);
      /* opacity gates the phrase boxes too: the clip-path wipe hides pixels but
         leaves the box in the layout, which reads as two overlapping text blocks. */
      /* Each phrase is parked far off-canvas (transform only, no layout) while it is
         not the active line, so the two text boxes never share coordinates — the
         clip-path wipe alone hides pixels but leaves both boxes stacked. */
      var PARK = -4000;
      gsap.set([p1, p2], { opacity: 0, y: PARK });

      /* ── one paused timeline ────────────────────────────────────────────── */
      var tl = gsap.timeline({ paused: true });

      /* ================= Cena A (0.0–0.8s) — a liquefação ================= */
      /* the frame-2 assembly arrives motionless at x0 y0 scale1 opacity1 and
         loses its card edges, then its ink, then itself — 600ms exactly. */
      tl.to(".f03-trafego-shell", {
        borderColor: "rgba(255,255,255,0)",
        backgroundColor: "rgba(255,255,255,0)",
        duration: 0.30, ease: "power2.in"
      }, 0.00);
      tl.to(".f03-trafego-ink", {
        opacity: 0, duration: 0.32, ease: "power2.in", stagger: 0.022
      }, 0.04);
      tl.to("#f03-trafego-cluster", {
        scale: 0.93, y: 38, duration: 0.60, ease: "power2.in"
      }, 0.00);
      tl.to("#f03-trafego-cluster", {
        opacity: 0, duration: 0.30, ease: "power1.in"
      }, 0.30);

      /* seven flows draw toward the low vanishing point (540,1300) */
      lines.forEach(function (p, i) {
        tl.to(p, { strokeDashoffset: 0, duration: 0.40, ease: "power2.out" }, 0.05 + i * 0.055);
      });
      /* a short travelling dash per flow — the visitor signal riding the line */
      heads.forEach(function (p, i) {
        var at = 0.26 + i * 0.055;
        tl.set(p, { opacity: 0.9 }, at);
        tl.to(p, {
          strokeDashoffset: HEAD_DASH + headLen[i],
          duration: 1.10, ease: "power2.in"
        }, at);
        tl.to(p, { opacity: 0, duration: 0.26, ease: "none" }, at + 0.94);
      });

      /* ================= Cena B (0.4–2.8s) — o voo ======================== */
      /* LEG 1 — energetic departure: translateZ +300 / rotateX -8°, power2.in */
      tl.to(cam, {
        z: 300, rotX: -8, y: 70,
        duration: 1.30, ease: "power2.in", onUpdate: applyCamera
      }, 0.40);
      /* motion-blur envelope peaks at peak velocity */
      tl.to(fx, { blur: 9, duration: 1.00, ease: "power2.in", onUpdate: applyBlur }, 0.55);
      tl.to(fx, { blur: 0, duration: 1.05, ease: "power3.out", onUpdate: applyBlur }, 1.55);

      /* the landing page grows out of the vanishing point, far at the back */
      tl.fromTo(mock,
        { opacity: 0, scale: MOCK_REST_SCALE * 0.20, y: 430, z: -820 },
        { opacity: 1, scale: MOCK_REST_SCALE * 0.50, y: 250, z: -420, duration: 1.30, ease: "power2.in" },
        0.40);

      /* the flows are absorbed by the page */
      tl.to("#f03-trafego-flows", { opacity: 0, duration: 0.80, ease: "power2.in" }, 1.80);

      /* ========== Cena C (1.6–4.0s) — a primeira frase, a câmera para ===== */
      /* LEG 2 — deceleration that lands flat ON the page and stops at 3.0s */
      tl.to(cam, {
        z: CAM_LAND_Z, rotX: 0, y: 0,
        duration: 1.30, ease: "power3.out", onUpdate: applyCamera
      }, 1.70);
      tl.to(mock, {
        scale: MOCK_REST_SCALE, y: MOCK_REST_Y, z: 0,
        duration: 1.30, ease: "power3.out"
      }, 1.70);

      /* phrase 1 — mask-wipe downward, flat in the camera plane */
      tl.set(p1, { opacity: 1, y: 0 }, 1.55);
      tl.to(w1, {
        insB: 0, duration: 0.70, ease: "power3.out",
        onUpdate: function () { wipeState(p1, w1); }
      }, 1.55);

      /* purple/cyan rig lights come up as the camera settles */
      tl.fromTo("#f03-trafego-rig",
        { opacity: 0 },
        { opacity: 1, duration: 1.10, ease: "power2.out" },
        1.80);

      /* ---- HOLD 1 : 3.00s → 4.00s, nothing in this frame moves ---------- */

      /* ============ Cena D (4.0–7.0s) — o congelamento ==================== */
      /* phrase 1 is erased downward, phrase 2 settles in the same place */
      tl.to(w1, {
        insA: 100, duration: 0.38, ease: "power2.in",
        onUpdate: function () { wipeState(p1, w1); }
      }, 4.00);
      tl.set(p1, { opacity: 0, y: PARK }, 4.38);
      tl.set(p2, { opacity: 1, y: 0 }, 4.30);
      tl.to(w2, {
        insB: 0, duration: 0.65, ease: "power3.out",
        onUpdate: function () { wipeState(p2, w2); }
      }, 4.30);

      /* the headline inside the page is visibly stuck: a caret that never blinks */
      tl.fromTo("#f03-trafego-caret",
        { opacity: 0 },
        { opacity: 1, duration: 0.40, ease: "power1.out" },
        4.00);

      /* the purple/cyan light falls to 55% — handoff_out */
      tl.to("#f03-trafego-rig", { opacity: 0.55, duration: 0.90, ease: "power2.inOut" }, 4.00);

      /* colour settles onto already-legible white text: "mesma coisa" → sand */
      tl.fromTo("#f03-trafego-emph",
        { color: "#FFFFFF" },
        { color: "#D8C0A7", duration: 0.42, ease: "power1.inOut" },
        5.20);

      /* ---- HOLD 2 : 5.62s → 7.00s, absolute stillness. No exit tween:
              the root transition is this frame's exit. -------------------- */

      window.__timelines = window.__timelines || {};
      window.__timelines["03-trafego-congela"] = tl;
    })();
  </script>
