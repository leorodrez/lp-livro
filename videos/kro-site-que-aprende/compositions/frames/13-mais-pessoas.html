  <script>
    window.__timelines = window.__timelines || {};
    (function () {
      var tl = gsap.timeline({ paused: true });

      // ── the camera (viewport-change: ONE .world wrapper, ONE cam state) ──
      // World box 1600x3600, origin 50% 50% == canvas centre.
      //   screenX = 540 + S*(wx-800)          screenY = 960 + S*(wy-1800) + cam.y
      var world = document.getElementById("f13-world");
      var cam = { s: 0.70, x: 0, y: 0 };
      function applyCamera() {
        world.style.transform =
          "translate(" + cam.x + "px," + cam.y + "px) scale(" + cam.s + ")";
      }
      applyCamera(); // seed frame 0

      // depth-of-field writers (proxy-tweened -> seek-safe)
      var flows = document.getElementById("f13-flows");
      var page = document.getElementById("f13-page");
      var dofFar = { b: 0 };
      var dofNear = { b: 6 };
      function applyFar() { flows.style.filter = "blur(" + dofFar.b + "px)"; }
      function applyNear() { page.style.filter = "blur(" + dofNear.b + "px)"; }
      applyFar();
      applyNear();

      // ── the flood: 22 traffic-flows, built deterministically ────────────
      var NS = "http://www.w3.org/2000/svg";
      var svg = document.getElementById("f13-flows-svg");
      var EY = 2090; // every flow aims just above the page's top edge
      var specs = [];
      var i;

      // family A — in over the top edge
      var aSx = [60, 280, 480, 700, 900, 1120, 1340, 1540];
      var aEx = [360, 450, 540, 650, 760, 880, 1010, 1180];
      var aBow = [-300, 240, -220, 300, -260, 200, -340, 260];
      var aT = [0.00, 0.26, 0.10, 0.40, 0.18, 0.50, 0.32, 0.58];
      var aW = [6, 5, 6.5, 5.5, 6, 5, 6.5, 5.5];
      for (i = 0; i < 8; i++) {
        specs.push({
          d: "M " + aSx[i] + " 190 Q " + ((aSx[i] + aEx[i]) / 2 + aBow[i]) +
             " 1292 " + aEx[i] + " " + EY,
          t: aT[i], w: aW[i]
        });
      }
      // family B — in off the left edge
      var bSy = [760, 1050, 1340, 1620, 1900, 640, 1480];
      var bEx = [300, 350, 410, 320, 380, 270, 440];
      var bT = [0.06, 0.22, 0.36, 0.14, 0.46, 0.30, 0.54];
      var bW = [5.5, 6, 5, 6.5, 5.5, 6, 5];
      for (i = 0; i < 7; i++) {
        specs.push({
          d: "M -150 " + bSy[i] + " Q " + (-150 + (bEx[i] + 150) * 0.80) + " " +
             (bSy[i] + (EY - bSy[i]) * 0.14) + " " + bEx[i] + " " + EY,
          t: bT[i], w: bW[i]
        });
      }
      // family C — in off the right edge
      var cSy = [700, 990, 1280, 1560, 1860, 600, 1420];
      var cEx = [1240, 1160, 1280, 1190, 1100, 1300, 1150];
      var cT = [0.12, 0.28, 0.42, 0.20, 0.52, 0.04, 0.60];
      var cW = [6, 5.5, 6.5, 5, 6, 5.5, 6.5];
      for (i = 0; i < 7; i++) {
        specs.push({
          d: "M 1760 " + cSy[i] + " Q " + (1760 + (cEx[i] - 1760) * 0.80) + " " +
             (cSy[i] + (EY - cSy[i]) * 0.14) + " " + cEx[i] + " " + EY,
          t: cT[i], w: cW[i]
        });
      }

      var DT = 460; // tail streak length (the motion-blur trail), world px
      var DH = 120; // bright head length, world px
      specs.forEach(function (sp, k) {
        var g = document.createElementNS(NS, "g");
        var tail = document.createElementNS(NS, "path");
        var head = document.createElementNS(NS, "path");
        tail.setAttribute("d", sp.d);
        head.setAttribute("d", sp.d);
        tail.setAttribute("class", "f13-flow-tail");
        head.setAttribute("class", "f13-flow-head");
        tail.setAttribute("stroke-width", sp.w);
        head.setAttribute("stroke-width", sp.w * 1.1);
        g.appendChild(tail);
        g.appendChild(head);
        svg.appendChild(g);

        var L = tail.getTotalLength(); // static geometry, measured once at setup
        tail.setAttribute("stroke-dasharray", DT + " " + (L + DT * 2));
        head.setAttribute("stroke-dasharray", DH + " " + (L + DT * 2));

        // dash travels the path: offset DT (before the start) -> -L (past the end).
        // the head rides the tail's leading edge: offsetHead = offsetTail - DT + DH
        function pass(t0, dur, ease) {
          tl.fromTo(tail, { strokeDashoffset: DT },
            { strokeDashoffset: -L, duration: dur, ease: ease }, t0);
          tl.fromTo(head, { strokeDashoffset: DH },
            { strokeDashoffset: -L - DT + DH, duration: dur, ease: ease }, t0);
        }
        // Scene A (0.0-1.6) — the flood arrives, sharp, fast, many.
        pass(sp.t, 0.88 + (k % 3) * 0.07, "power1.in");
        // Scenes B/C — they keep arriving, out of focus, irrelevant. Last
        // pass lands at 4.52s so the 4.7s hold is completely still.
        pass(1.78 + (k % 7) * 0.26, 1.18, "none");
      });

      // ── Scene A/handoff_in: the previous sentence lets go while the page

      tl.fromTo("#f13-handoff", { opacity: 1 },

      tl.fromTo("#f13-b1", { opacity: 0, y: 18 },

      // ── Scene B (1.6-3.2): the camera REFUSES to follow the new flows.

      //    sends everything that is still arriving to 9px of blur. ──────────
      tl.fromTo(cam, { s: 0.70, y: 0 },

      tl.fromTo(dofFar, { b: 0 },

      tl.fromTo(flows, { opacity: 1 },
        { opacity: 0.44, duration: 1.6, ease: "power2.inOut" }, 1.60);

      // what stays in focus: the six visits that already arrived
      var sigs = ["#f13-s1", "#f13-s2", "#f13-s3", "#f13-s4", "#f13-s5", "#f13-s6"];

      gsap.set(sigs, { transformOrigin: "50% 50%" });
      gsap.set("#f13-rise", { transformOrigin: "50% 100%" });
      sigs.forEach(function (sel, k) {
        tl.fromTo(sel, { opacity: 0.38, scale: 0.82 },
          { opacity: 1, scale: 1, duration: 0.62, ease: "power2.out" }, sigT[k]);
      });

      // ── Scene D (4.7-6.0): 1.3s of stillness. At 5.70 one of the six
      //    signals leaves the group and starts climbing the page — the cut
      //    comes out of it. handoff_out: x -120, y +620, scale 1, opacity 1. ─
      tl.fromTo("#f13-s6", { y: 0 },
        { y: -120, duration: 0.30, ease: "power2.in" }, 5.70);
      tl.fromTo("#f13-rise", { scaleY: 0 },
        { scaleY: 1, duration: 0.30, ease: "power2.in" }, 5.70);

      window.__timelines["13-mais-pessoas"] = tl;
    })();
