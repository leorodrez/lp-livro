    (function () {
      var FRAME = "10-opiniao-achismo";
      var P = ".f10-opiniao-achismo--";
      var root = document.querySelector('[data-composition-id="' + FRAME + '"]');
      var q = function (s) {
        return root.querySelector(s);
      };
      var qa = function (s) {
        return Array.prototype.slice.call(root.querySelectorAll(s));
      };

      /* ── ONE tempo grid drives everything (kinetic-beat-slam) ───────────────
         The sentence is a parallel construction, so the grid is too: beat 1 at
         0.0 + offsets, beat 2 at exactly the same offsets + SCENE. Nothing is
         hand-tuned per beat — that is what makes the two halves identical. */
      var PULSE = 0.05; // sub-beat
      var SCENE = 2.0; // the beat period
      var BEATS = [0, SCENE]; // the two percussive hits
      var T_TEXT = 4 * PULSE; //  0.20 / 2.20 — statement slams in
      var T_HIT = 7 * PULSE; //  0.35 / 2.35 — the dry beat: the sheet is swept out
      var T_TINT = 22 * PULSE; //  1.10 / 3.10 — the named word recedes
      var T_STILL = 28 * PULSE; //  1.40 / 3.40 — stillness begins; nothing moves after

      /* identical mechanics on both beats — same vector, distance, duration, ease */
      var SLAM_FROM = 1.16,
        SLAM_DUR = 0.42,
        SLAM_EASE = "power4.out";
      var SWIPE_X = 760,
        SWIPE_DUR = 0.32,
        SWIPE_EASE = "power3.in",
        SWIPE_BLUR = 14;
      var TINT_DUR = 0.24; // colour settles onto already-legible text
      var WHITE = "rgba(255,255,255,1)",
        RECEDED = "rgba(255,255,255,0.38)";

      var tl = gsap.timeline({ paused: true });

      var beat = [
        {
          stmt: q(P + "stmt-a"),
          word: q(P + "stmt-a " + P + "word"),
          sheet: q(P + "lay-opinion"),
        },
        {
          stmt: q(P + "stmt-b"),
          word: q(P + "stmt-b " + P + "word"),
          sheet: q(P + "lay-guess"),
        },
      ];

      beat.forEach(function (b, i) {
        var t = BEATS[i];

        /* seam: a dry cut at full opacity — the outgoing card is removed, not
           tweened out (titlecard-reveal card chain). Same footprint, same
           transform-origin, incoming above: scale-swap-transition geometry. */
        if (i > 0) tl.set(beat[i - 1].stmt, { opacity: 0 }, t + T_TEXT);

        /* the statement lands with a percussive scale settle — no blur, ever,
           on hero typography. Beat 2 reuses these exact numbers. */
        tl.fromTo(
          b.stmt,
          { opacity: 0, scale: SLAM_FROM },
          { opacity: 1, scale: 1, duration: SLAM_DUR, ease: SLAM_EASE },
          t + T_TEXT,
        );

        /* the subjective sheet is swept off the system on the beat */
        tl.fromTo(
          b.sheet,
          { x: 0, opacity: 0.5, filter: "blur(0px)" },
          {
            x: SWIPE_X,
            opacity: 0,
            filter: "blur(" + SWIPE_BLUR + "px)",
            duration: SWIPE_DUR,
            ease: SWIPE_EASE,
          },
          t + T_HIT,
        );

        /* the named word recedes to text-light once it is already read in white */
        tl.fromTo(
          b.word,
          { color: WHITE },
          { color: RECEDED, duration: TINT_DUR, ease: "none" },
          t + T_TINT,
        );
      });

      /* what is actually underneath the second sheet: real behaviour.
         Cascades in across the back half and is finished before the hold. */
      var DOT_AT = BEATS[1] + 54 * PULSE; // 2.70 — after the sheet has cleared
      var DOT_STEP = 0.04;
      qa(P + "dot").forEach(function (d, k) {
        tl.fromTo(
          d,
          { opacity: 0, scale: 0.2 },
          { opacity: 1, scale: 1, duration: 0.22, ease: "power3.out" },
          DOT_AT + k * DOT_STEP,
        );
      });
      qa(P + "ring").forEach(function (r, k) {
        tl.fromTo(
          r,
          { opacity: 0.5, scale: 0.26 },
          { opacity: 0, scale: 1, duration: 0.3, ease: "power2.out" },
          DOT_AT + 0.06 + k * DOT_STEP,
        );
      });
      /* last motion ends at 3.34s — the frame sits completely still through
         T_STILL + SCENE (3.40s) to 4.00s. No exit: the cut is the exit. */

      window.__timelines = window.__timelines || {};
      window.__timelines[FRAME] = tl;
      tl.seek(0);
    })();
