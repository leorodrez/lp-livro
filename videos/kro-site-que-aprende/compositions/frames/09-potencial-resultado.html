  </style>

  <div id="root" data-composition-id="09-potencial-resultado" data-width="1080" data-height="1920">

    <div class="clip f09pr-ground" data-start="0" data-duration="4.5" data-track-index="0">
      <svg class="f09pr-grain" width="1080" height="1920" viewBox="0 0 1080 1920"
           xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <filter id="f09pr-grain-filter" x="0" y="0" width="100%" height="100%">
          <feTurbulence type="fractalNoise" baseFrequency="0.82" numOctaves="3" seed="9" stitchTiles="stitch"/>
        </filter>
        <rect width="1080" height="1920" filter="url(#f09pr-grain-filter)"/>
      </svg>
    </div>

    <!-- L2 — the system: four variants reordered by observed potential -->
    <div class="clip f09pr-space" data-start="0" data-duration="4.5" data-track-index="1">
      <div class="f09pr-stage">

        <!-- variant-card #1 — recedes to z -80 (second in the new order) -->
        <div class="f09pr-unit" data-tx="-312" data-ty="-235" data-tz="-80" data-fill="0.52">
          <div class="f09pr-skin f09pr-dim">

              <div class="f09pr-bar"><span class="f09pr-fill"></span></div>

        <div class="f09pr-unit f09pr-focus" data-tx="0" data-ty="0" data-tz="0" data-fill="0.88">
          <div class="f09pr-skin">
            <div class="f09pr-glow-top"></div>
            <div class="f09pr-card">
              <div class="f09pr-sheen"></div>
              <div class="f09pr-chrome"><i></i><i></i><i></i></div>

        <div class="f09pr-unit" data-tx="312" data-ty="-210" data-tz="-160" data-fill="0.34">

            <div class="f09pr-card">

              <div class="f09pr-chrome"><i></i><i></i><i></i></div>

        <div class="f09pr-unit" data-tx="10" data-ty="255" data-tz="-240" data-fill="0.21">

            <div class="f09pr-card">
              <div class="f09pr-sheen"></div>
              <div class="f09pr-chrome"><i></i><i></i><i></i></div>

    <!-- L3 — hero typography (onscreen_text, verbatim) -->

  </div>

  <script>
    (function () {
      var FRAME = "09-potencial-resultado";
      var root = document.querySelector('[data-composition-id="' + FRAME + '"]');
      var q = function (s) { return root.querySelector(s); };
      var qa = function (s) { return Array.prototype.slice.call(root.querySelectorAll(s)); };

      var tl = gsap.timeline({ paused: true });

      var stage = q(".f09pr-stage");
      var units = qa(".f09pr-unit");           // DOM order 0..3 = variant #1..#4
      var n = units.length;
      var WINNER = 1;                          // variant-card #2

      /* ── depth-scatter-assemble — every scattered value index-derived ──── */
      var GOLDEN = Math.PI * (3 - Math.sqrt(5));
      var RADIUS = 320;
      var Z_NEAR = -10, Z_FAR = -70;           // shallow start: all three then recede
      var TUMBLE = 18;                         // one-faced cards — kept well under 80
      var ASSEMBLE_DUR = 1.05, STAGGER = 0.06, ASSEMBLE_START = 0.08;

      var scatter = units.map(function (el, i) {
        var a = i * GOLDEN;
        var depthT = n > 1 ? i / (n - 1) : 0;
        return {
          x: Math.cos(a) * RADIUS,
          y: Math.sin(a) * RADIUS,
          z: Z_NEAR - depthT * (Z_NEAR - Z_FAR),
          rotationX: Math.sin(a) * TUMBLE,
          rotationY: Math.cos(a) * TUMBLE,
          scale: 1,
          opacity: 0.45
        };
      });

      /* handoff_in — variant-card #2 starts exactly where frame 08 left it */
      scatter[WINNER] = {
        x: -40, y: 120, z: 0, rotationX: 0, rotationY: 0, scale: 0.94, opacity: 1
      };

      /* park the cloud BEFORE any tween so frame 0 is the inherited state */
      units.forEach(function (el, i) {
        var s = scatter[i];
        gsap.set(el, {
          xPercent: -50, yPercent: -50,
          x: s.x, y: s.y, z: s.z,
          rotationX: s.rotationX, rotationY: s.rotationY,
          scale: s.scale, opacity: s.opacity
        });
      });

      /* Cena A (0.0–1.4s) — the reorganization. Gentle cloud life underneath. */
      tl.fromTo(stage,
        { rotationY: -5, rotationX: 2.5 },
        { rotationY: 0, rotationX: 0, duration: 1.25, ease: "power2.out" },
        0);

      units.forEach(function (el, i) {
        var s = scatter[i];
        var win = i === WINNER;
        tl.fromTo(el,
          {
            x: s.x, y: s.y, z: s.z,
            rotationX: s.rotationX, rotationY: s.rotationY,
            scale: s.scale, opacity: s.opacity
          },
          {
            /* handoff_out — focus centred and flat; losers recede, never vanish */
            x: Number(el.dataset.tx),
            y: Number(el.dataset.ty),
            z: Number(el.dataset.tz),
            rotationX: 0, rotationY: 0,
            scale: 1,
            opacity: win ? 1 : 0.3,
            duration: ASSEMBLE_DUR,
            ease: "power3.out"
          },
          ASSEMBLE_START + i * STAGGER);
      });

      /* observed potential measuring itself — scaleX fills, never width */
      units.forEach(function (el, i) {
        tl.fromTo(el.querySelector(".f09pr-fill"),
          { scaleX: 0 },
          { scaleX: Number(el.dataset.fill), duration: 0.70, ease: "power2.out" },
          0.30 + i * 0.07);
      });

      /* Cena B (1.0–2.2s) — the light. Bloom-and-hold, nothing else glows. */
      tl.fromTo(q(".f09pr-glow-top"),
        { opacity: 0, scale: 0.92 },
        { opacity: 0.38, scale: 1, duration: 0.75, ease: "power2.out" },
        1.05);
      tl.fromTo(q(".f09pr-glow-bar"),
        { opacity: 0, scale: 0.90 },
        { opacity: 0.34, scale: 1, duration: 0.70, ease: "power2.out" },
        1.25);

      /* Cena C (0.5–3.3s) — the phrase. Lateral mask-reveal from the left. */
      function maskReveal(el, at, dur) {
        var p = { v: 0 };
        tl.fromTo(p, { v: 0 }, {
          v: 1, duration: dur, ease: "power2.out",
          onUpdate: function () {
            el.style.clipPath = "inset(0 " + ((1 - p.v) * 100).toFixed(3) + "% 0 0)";
          }
        }, at);
        tl.set(el, { clipPath: "inset(0 0% 0 0)" }, at + dur);
      }

      tl.fromTo(q(".f09pr-accent"),
        { scaleX: 0 }, { scaleX: 1, duration: 0.30, ease: "power2.out" }, 0.38);

      maskReveal(q(".f09pr-l1"), 0.50, 0.54);
      maskReveal(q(".f09pr-l2"), 0.59, 0.54);
      maskReveal(q(".f09pr-l3"), 2.00, 0.54);

      /* colour lands on text that is already legible in white — no glow */
      tl.fromTo(q(".f09pr-res"),
        { color: "#FFFFFF" },
        { color: "#06B6D4", duration: 0.34, ease: "power1.inOut" },
        2.74);

      /* Cena D (3.3–4.5s) — every tween is done by 3.08s: a still image. */
      tl.to({ hold: 0 }, { hold: 1, duration: 1.42, ease: "none" }, 3.08);

      window.__timelines = window.__timelines || {};
      window.__timelines[FRAME] = tl;
    })();
  </script>
