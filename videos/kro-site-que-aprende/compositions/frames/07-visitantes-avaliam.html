  <script>
    (function () {
      var FID = "07-visitantes-avaliam";
      var root = document.querySelector('[data-composition-id="' + FID + '"]');
      var cam = root.querySelector(".f07-cam");
      var slots = Array.prototype.slice.call(root.querySelectorAll(".f07-slot"));
      var lines = Array.prototype.slice.call(root.querySelectorAll(".f07-line"));
      var emCyan = root.querySelector(".f07-em-c");

      var tl = gsap.timeline({ paused: true });

      /* ---------- handoff_in : the four variant-cards, parked ---------- */
      var X = [-330, -110, 110, 330];
      var Z = [0, -90, -180, -270];
      slots.forEach(function (s, i) {
        gsap.set(s, { x: X[i], y: 180, scale: 0.82, z: 0, opacity: 1 });
      });

      /* ---------- Cena A (0.0-1.0s) : the planes separate ---------- */
      tl.fromTo(
        cam,
        { rotationY: 0, rotationX: 0 },
        { rotationY: 14, rotationX: -2.5, duration: 0.95, ease: "power2.inOut" },
        0,
      );
      slots.forEach(function (s, i) {
        tl.fromTo(s, { z: 0 }, { z: Z[i], duration: 0.86, ease: "power3.out" }, 0.06 + i * 0.03);
      });

      /* ---------- Cena C (0.7-3.0s) : the sentence, short 30px lateral slide ---------- */
      var LINE_AT = [0.7, 0.82, 1.9, 2.02];
      lines.forEach(function (el, i) {
        tl.fromTo(
          el,
          { x: -30, opacity: 0 },
          { x: 0, opacity: 1, duration: 0.46, ease: "power3.out" },
          LINE_AT[i],
        );
      });
      /* emphasis : colour settles onto already-legible white text */
      tl.fromTo(
        emCyan,
        { opacity: 0 },
        { opacity: 1, duration: 0.34, ease: "power1.inOut", immediateRender: false },
        2.6,
      );

      /* ---------- Cena B (0.5-4.0s) : the visitors arrive ---------- */
      /* baked, deterministic arrival schedule: [t, slot, localX, localY, lateralOffset, isCursor] */
      var SIG = [
        [0.55, 0, 96, 120, -150, 0],
        [0.74, 2, 152, 104, 130, 0],
        [0.92, 1, 112, 166, -110, 1],
        [1.1, 3, 128, 122, 160, 0],
        [1.28, 0, 188, 206, 140, 0],
        [1.48, 1, 76, 108, -96, 0],
        [1.68, 2, 98, 192, -140, 1],
        [1.9, 0, 132, 272, 96, 0],
        [2.1, 3, 84, 196, -126, 0],
        [2.32, 1, 172, 238, 146, 0],
        [2.54, 2, 176, 268, 104, 0],
        [2.76, 0, 68, 180, -156, 1],
        [3.04, 3, 160, 278, 124, 0],
        [3.3, 1, 126, 306, -86, 0],
      ];
      /* nudge-curve : ramp-in 10% dist / 20% time, linear burst 65% / 18%, tail 25% / 62% */
      var T = 0.66,
        P1 = 0.132,
        P2 = 0.119,
        P3 = 0.409,
        START_Y = 1150;
      var CURSOR =
        '<svg viewBox="0 0 18 22" aria-hidden="true"><path d="M1.6 1.2 L1.6 17.4 L6.1 13.1 L8.9 20.6 L12.1 19.2 L9.3 11.9 L15.2 11.4 Z" fill="#06b6d4"/></svg>';
      var breathing = [];

      SIG.forEach(function (d, i) {
        var t0 = d[0],
          si = d[1],
          lx = d[2],
          ly = d[3],
          dx = d[4],
          isCur = d[5];
        var slot = slots[si];
        var marks = slot.querySelector(".f07-marks");
        var field = slot.querySelector(".f07-signals");

        /* rings live in DOM from t=0, at the touch point, invisible */
        var ring = document.createElement("div");
        ring.className = "f07-ring";
        ring.style.left = lx + "px";
        ring.style.top = ly + "px";
        marks.appendChild(ring);

        var ping = document.createElement("div");
        ping.className = "f07-ping";
        ping.style.left = lx + "px";
        ping.style.top = ly + "px";
        marks.appendChild(ping);

        var sig = document.createElement("div");
        sig.className = "f07-sig";
        sig.style.left = lx + "px";
        sig.style.top = ly + "px";
        var xw = document.createElement("div");
        xw.className = "f07-xw";
        var trail = document.createElement("div");
        trail.className = "f07-trail";
        var head = document.createElement("div");
        head.className = "f07-head" + (isCur ? " f07-head-cur" : "");
        if (isCur) head.innerHTML = CURSOR;
        xw.appendChild(trail);
        xw.appendChild(head);
        sig.appendChild(xw);
        field.appendChild(sig);

        var D = START_Y - ly;

        /* travel : three-phase slow-fast-slow climb from the base */
        tl.fromTo(
          sig,
          { y: D, opacity: 0 },
          { y: D * 0.9, opacity: 1, duration: P1, ease: "power3.in" },
          t0,
        );
        tl.fromTo(
          sig,
          { y: D * 0.9 },
          { y: D * 0.25, duration: P2, ease: "none", immediateRender: false },
          t0 + P1,
        );
        tl.fromTo(
          sig,
          { y: D * 0.25 },
          { y: 0, duration: P3, ease: "power4.out", immediateRender: false },
          t0 + P1 + P2,
        );
        /* the lateral component that bows the path into a curve */
        tl.fromTo(xw, { x: dx }, { x: 0, duration: T * 0.9, ease: "power2.out" }, t0);

        /* short trail */
        tl.fromTo(
          trail,
          { scaleY: 0.3, opacity: 0 },
          { scaleY: 1, opacity: 0.55, duration: P1 + P2, ease: "power2.out" },
          t0,
        );
        tl.fromTo(
          trail,
          { scaleY: 1, opacity: 0.55 },
          { scaleY: 0.22, opacity: 0.28, duration: P3 * 0.8, ease: "power3.out", immediateRender: false },
          t0 + P1 + P2,
        );

        /* the touch : press on the actor, then ring feedback that stays */
        var at = t0 + T;
        tl.fromTo(
          head,
          { scale: 1 },
          { scale: 0.78, duration: 0.07, ease: "power2.in", immediateRender: false },
          at - 0.07,
        );
        tl.fromTo(
          head,
          { scale: 0.78, opacity: 1 },
          { scale: 0.56, opacity: 0.7, duration: 0.22, ease: "power2.out", immediateRender: false },
          at,
        );
        tl.fromTo(
          ring,
          { scale: 0.2, opacity: 0 },
          { scale: 1, opacity: 1, duration: 0.34, ease: "power3.out", immediateRender: false },
          at,
        );
        tl.fromTo(
          ping,
          { scale: 0.25, opacity: 0.9 },
          { scale: 3.2, opacity: 0, duration: 0.66, ease: "power2.out", immediateRender: false },
          at,
        );

        if (at <= 3) breathing.push(trail);
      });

      /* ---------- Cena D (3.0-4.0s) : hold. Text dead still; only the signals breathe ---------- */
      tl.fromTo(
        breathing,
        { y: 0 },
        { y: -3, duration: 0.5, ease: "sine.inOut", immediateRender: false },
        3.0,
      );
      tl.fromTo(
        breathing,
        { y: -3 },
        { y: 0, duration: 0.5, ease: "sine.inOut", immediateRender: false },
        3.5,
      );

      window.__timelines = window.__timelines || {};
      window.__timelines[FID] = tl;
      tl.seek(0);
    })();
  </script>
