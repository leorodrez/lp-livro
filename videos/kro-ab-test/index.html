<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1080" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1080px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 1080px;
        height: 1080px;
        overflow: hidden;
        background: #2B2B2B;
      }
      .scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="25"
      data-width="1080"
      data-height="1080"
    >
      <div
        id="el-01-a-pagina"
        class="scene"
        data-composition-id="01-a-pagina"
        data-composition-src="compositions/frames/01-a-pagina.html"
        data-start="0"
        data-duration="3.5"
        data-track-index="0"
      ></div>

      <div
        id="el-02-duplica"
        class="scene"
        data-composition-id="02-duplica"
        data-composition-src="compositions/frames/02-duplica.html"
        data-start="3.5"
        data-duration="4"
        data-track-index="1"
      ></div>

      <div
        id="el-03-triplica"
        class="scene"
        data-composition-id="03-triplica"
        data-composition-src="compositions/frames/03-triplica.html"
        data-start="7.5"
        data-duration="4"
        data-track-index="0"
      ></div>

      <div
        id="el-04-campea"
        class="scene"
        data-composition-id="04-campea"
        data-composition-src="compositions/frames/04-campea.html"
        data-start="11.5"
        data-duration="6"
        data-track-index="1"
      ></div>

      <div
        id="el-05-mecanismo"
        class="scene"
        data-composition-id="05-mecanismo"
        data-composition-src="compositions/frames/05-mecanismo.html"
        data-start="17.5"
        data-duration="5"
        data-track-index="0"
      ></div>

      <div
        id="el-06-cta"
        class="scene"
        data-composition-id="06-cta"
        data-composition-src="compositions/frames/06-cta.html"
        data-start="22"
        data-duration="3"
        data-track-index="1"
      ></div>

    </div>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
      // ── frame transitions (injected by transitions.mjs) ──
      (function () { var tl = window.__timelines["main"];
        tl.to("#el-05-mecanismo", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 22);
        tl.fromTo("#el-06-cta", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 22);
        tl.to({}, { duration: 25 }, 0); // full-span anchor — main.duration() == composition total (Studio master duration)
      })();
    </script>
  </body>
</html>
