  <script>
  (function(){
    const root = document.querySelector('[data-composition-id="09-cem-e-um"]');
    const q  = s => root.querySelector(s);
    const qa = s => Array.prototype.slice.call(root.querySelectorAll(s));
    const tl = gsap.timeline({ paused: true });

    /* entrada → HOLD → saída. O HOLD é explícito e nada o atravessa. */
    function show(el, at, enter, hold, exit, rise){
      const dy = (rise === undefined ? 20 : rise);
      tl.set(el, { autoAlpha:0, y:dy }, 0);   // estado inicial explicito: seek em t=0 pousa certo
      tl.fromTo(el, { autoAlpha:0, y:dy }, { autoAlpha:1, y:0, duration:enter, ease:'power3.out' }, at);
      if (exit > 0) tl.to(el, { autoAlpha:0, y:-dy*0.7, duration:exit, ease:'power2.in' }, at+enter+hold);
      return at+enter+hold+(exit>0?exit:0);
    }
    /* revelação por máscara vertical — a entrada da tese */
    function mask(el, at, enter, hold, exit){
      const inner = el.querySelector('span');
      tl.set(el, { autoAlpha:1 }, 0);
      tl.set(inner, { yPercent:106 }, 0);     // idem: a mascara comeca fechada
      tl.fromTo(inner, { yPercent:106 }, { yPercent:0, duration:enter, ease:'power3.out' }, at);
      if (exit > 0) tl.to(inner, { yPercent:-106, duration:exit, ease:'power2.in' }, at+enter+hold);
      return at+enter+hold+(exit>0?exit:0);
    }

    tl.set(q('.grid'), { autoAlpha:1 }, 0);

    function countTo(el, from, to, at, dur){
      const o = { v: from };
      el.textContent = String(from);
      tl.to(o, { v: to, duration: dur, ease: 'power2.out',
        onUpdate: function(){ el.textContent = String(Math.round(o.v)); } }, at);
    }
    tl.set(q('.cA'), { x:26, y:363.75, scale:0.34, autoAlpha:.52 }, 0);
    tl.set(q('.cB'), { x:648, y:307.5, scale:0.52, autoAlpha:1 }, 0);
    tl.set(q('.cB .pcard-ring'), { opacity:1 }, 0);
    [1,2,3].forEach(function(i){
      const p = [{"x":488,"y":769.25,"s":0.22}, {"x":828,"y":769.25,"s":0.22}, {"x":1168,"y":769.25,"s":0.22}][i-1];
      tl.set(q('.c'+i), { x:p.x, y:p.y, scale:p.s, autoAlpha:1 }, 0);
      tl.to(q('.c'+i), { autoAlpha:0, duration:.6, ease:'power2.in' }, 0);
    });
    /* as duas voltam a ter o MESMO peso, a mesma luz, a mesma nitidez */
    tl.to(q('.cA'), { x:204, y:256.25, scale:0.46, autoAlpha:1, duration:1.2, ease:'power2.inOut' }, 0);
    tl.to(q('.cB'), { x:1164, y:256.25, scale:0.46, duration:1.2, ease:'power2.inOut' }, 0);
    tl.to(q('.cB .pcard-ring'), { opacity:.45, duration:.8 }, 0.6);

    /* 100 → 101. anticlimatico de proposito: e esse o argumento. */
    countTo(q('.nA'), 100, 100, 1.2, 1.4);
    countTo(q('.nB'), 100, 101, 1.2, 1.4);
    tl.fromTo(q('.nB').parentNode, { scale:1 }, { scale:1.04, duration:1.4, ease:'power2.out' }, 1.2);

    /* a camera se aproxima dos numeros e PARA antes da frase */
    tl.set(q('.cam'), { transformOrigin:'960px 654px' }, 0);
    tl.to(q('.cam'), { scale:1.34, duration:.8, ease:'power2.inOut' }, 2.6);
    tl.to([q('.cA'), q('.cB')], { autoAlpha:.78, duration:.8, ease:'power2.inOut' }, 2.6);
    show(q('.t-1pc'), 3.4, .4, 3.7, 0);   // HOLD 3.7s

    window.__timelines["09-cem-e-um"] = tl;
  })();
  </script>
