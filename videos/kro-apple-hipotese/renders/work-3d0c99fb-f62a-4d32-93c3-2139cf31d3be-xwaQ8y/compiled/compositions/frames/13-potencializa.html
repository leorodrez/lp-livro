  <script>
  (function(){
    const root = document.querySelector('[data-composition-id="13-potencializa"]');
    const q  = s => root.querySelector(s);
    const qa = s => Array.prototype.slice.call(root.querySelectorAll(s));
    const tl = gsap.timeline({ paused: true });

    /* entrada → HOLD → saída. O HOLD é explícito e nada o atravessa. */
    function show(el, at, enter, hold, exit, rise){
      const dy = (rise === undefined ? 20 : rise);
      tl.set(el, { autoAlpha:0, y:dy }, 0);   // estado inicial explicito: seek em t=0 pousa certo
      tl.fromTo(el, { autoAlpha:0, y:dy }, { autoAlpha:1, y:0, duration:enter, ease:'power3.out' }, at);
      if (exit > 0) tl.to(el, { autoAlpha:0, y:-dy*0.7, duration:exit, ease:'power2.in' }, at+enter+hold);
      return at+enter+hold+(exit>0?exit:0);
    }
    /* revelação por máscara vertical — a entrada da tese */
    function mask(el, at, enter, hold, exit){
      const inner = el.querySelector('span');
      tl.set(el, { autoAlpha:1 }, 0);
      tl.set(inner, { yPercent:106 }, 0);     // idem: a mascara comeca fechada
      tl.fromTo(inner, { yPercent:106 }, { yPercent:0, duration:enter, ease:'power3.out' }, at);
      if (exit > 0) tl.to(inner, { yPercent:-106, duration:exit, ease:'power2.in' }, at+enter+hold);
      return at+enter+hold+(exit>0?exit:0);
    }

    const HP = [{"x":210,"y":557.13,"s":0.15},{"x":540,"y":557.13,"s":0.15},{"x":870,"y":557.13,"s":0.15},{"x":1200,"y":557.13,"s":0.15},{"x":1530,"y":557.13,"s":0.15}];
    qa('.hs').forEach(function(c, i){ tl.set(c, { x:HP[i].x, y:HP[i].y, scale:HP[i].s, autoAlpha:0 }, 0); });
    tl.set(q('.main'), { x:708, y:428.75, scale:.42, autoAlpha:0 }, 0);
    tl.set(q('.main .pcard-ring'), { opacity:0 }, 0);

    /* a frase herdada NAO se move: o espectador precisa reconhece-la */
    tl.set(q('.t-not'), { autoAlpha:1, y:0 }, 0);
    tl.set(q('.w-old'), { yPercent:0 }, 0);
    tl.set(q('.w-new'), { yPercent:100, color:'#06B6D4' }, 0);

    /* a troca no lugar — o verbo tem linha propria, entao nada reflui.
       o ciano marca o aprendizado e depois se retira. */
    tl.to(q('.w-old'), { yPercent:-100, duration:.55, ease:'power2.inOut' }, 0.3);
    tl.to(q('.w-new'), { yPercent:0, duration:.55, ease:'power2.inOut' }, 0.3);
    tl.to(q('.w-new'), { color:'#FFFFFF', duration:.45, ease:'power2.inOut' }, 0.9);
    /* HOLD 1.7s na frase mudada */
    tl.to(q('.t-not'), { autoAlpha:0, y:-14, duration:.4, ease:'power2.in' }, 3.0);

    /* a pagina excelente reaparece; atras dela, a memoria acumulada */
    tl.to(q('.main'), { autoAlpha:1, duration:.7, ease:'power2.out' }, 3.2);
    qa('.hs').forEach(function(c, i){
      tl.to(c, { autoAlpha:.14, duration:.6, ease:'power2.out' }, 3.3 + i * .09);
    });
    show(q('.t-fin'), 3.4, .4, 3.7, 0);   // HOLD 3.7s

    window.__timelines["13-potencializa"] = tl;
  })();
  </script>
