  <script>
  (function(){
    const root = document.querySelector('[data-composition-id="02-excelente"]');
    const q  = s => root.querySelector(s);
    const qa = s => Array.prototype.slice.call(root.querySelectorAll(s));
    const tl = gsap.timeline({ paused: true });

    /* entrada → HOLD → saída. O HOLD é explícito e nada o atravessa. */
    function show(el, at, enter, hold, exit, rise){
      const dy = (rise === undefined ? 20 : rise);
      tl.set(el, { autoAlpha:0, y:dy }, 0);   // estado inicial explicito: seek em t=0 pousa certo
      tl.fromTo(el, { autoAlpha:0, y:dy }, { autoAlpha:1, y:0, duration:enter, ease:'power3.out' }, at);
      if (exit > 0) tl.to(el, { autoAlpha:0, y:-dy*0.7, duration:exit, ease:'power2.in' }, at+enter+hold);
      return at+enter+hold+(exit>0?exit:0);
    }
    /* revelação por máscara vertical — a entrada da tese */
    function mask(el, at, enter, hold, exit){
      const inner = el.querySelector('span');
      tl.set(el, { autoAlpha:1 }, 0);
      tl.set(inner, { yPercent:106 }, 0);     // idem: a mascara comeca fechada
      tl.fromTo(inner, { yPercent:106 }, { yPercent:0, duration:enter, ease:'power3.out' }, at);
      if (exit > 0) tl.to(inner, { yPercent:-106, duration:exit, ease:'power2.in' }, at+enter+hold);
      return at+enter+hold+(exit>0?exit:0);
    }

    const cam = q('.cam'), track = q('.track');
    tl.set(track, { y:0 }, 0);
    tl.set(cam, { scale:1.05 }, 0);                    // match cut com o F01
    tl.to(track, { y:-420, duration:1.4, ease:'power1.in' }, 0);
    tl.to(cam,   { scale:.96, duration:1.4, ease:'power1.inOut' }, 0);
    /* pausa de reconhecimento sobre o Mac mini */
    tl.to(track, { y:-850, duration:1.2, ease:'power2.out' }, 1.4);
    tl.to(cam,   { scale:.91, duration:1.2, ease:'power2.out' }, 1.4);
    /* Mac Studio — pausa mais curta: o ritmo acelera de proposito */
    tl.to(track, { y:-1770, duration:1.2, ease:'power2.inOut' }, 2.6);
    tl.to(cam,   { scale:.80, duration:1.2, ease:'power2.inOut' }, 2.6);
    /* a grade de meios-tiles: o primeiro par comparavel do filme */
    tl.to(track, { y:-2630, duration:1.2, ease:'power2.inOut' }, 3.8);
    tl.to(cam,   { scale:.66, duration:1.2, ease:'power2.inOut' }, 3.8);
    /* volta rapida que desacelera ate o repouso ABSOLUTO */
    tl.to(track, { y:-850, duration:1.5, ease:'expo.out' }, 5.0);
    tl.to(cam,   { scale:1.15, duration:1.5, ease:'expo.out' }, 5.0);

    window.__timelines["02-excelente"] = tl;
  })();
  </script>
