    <div class="clip stage stage--dark" id="s-f12" data-start="0" data-duration="7.5">
      <div class="cam"><div class="field" data-layout-allow-overflow></div></div>
      <div class="diag dg">
        
        <div class="disc d0" style="left:352px;top:236px">DESIGNER</div>
        <svg class="ln l0" viewBox="0 0 250 2" width="250" height="2" style="left:588px;top:244px"><path d="M0 1 H250" stroke="#06B6D4" stroke-width="1.2"/></svg>
        <div class="hyp h0" style="left:850px;top:224px">hipótese</div>
        <div class="disc d1" style="left:352px;top:324px">COPYWRITER</div>
        <svg class="ln l1" viewBox="0 0 250 2" width="250" height="2" style="left:588px;top:332px"><path d="M0 1 H250" stroke="#06B6D4" stroke-width="1.2"/></svg>
        <div class="hyp h1" style="left:850px;top:312px">hipótese</div>
        <div class="disc d2" style="left:352px;top:412px">ESTRATEGISTA</div>
        <svg class="ln l2" viewBox="0 0 250 2" width="250" height="2" style="left:588px;top:420px"><path d="M0 1 H250" stroke="#06B6D4" stroke-width="1.2"/></svg>
        <div class="hyp h2" style="left:850px;top:400px">hipótese</div>
        <svg class="ln lk" viewBox="0 0 236 200" width="236" height="200" style="left:1024px;top:232px">
          <path d="M0 96 H60 M0 4 H60 Q92 4 92 96 M0 188 H60 Q92 188 92 96 M92 96 H236" stroke="#06B6D4" stroke-width="1.2" fill="none"/>
        </svg>
        <div class="disc dk" style="left:1272px;top:320px;font-size:19px">KRO</div>
        <div class="hyp hk" style="left:1272px;top:350px;border-color:#06B6D4">experimentação + aprendizado</div>
      </div>
      <div class="msg msg-lg t-not" style="top:614px"><span>KRO AI não</span><span class="swapline" data-layout-allow-overlap><span class="w-old"><b>substitui</b></span></span><span>grandes profissionais.</span></div>
    </div>
  </div>
  <script>
  (function(){
    const root = document.querySelector('[data-composition-id="12-nao-substituir"]');
    const q  = s => root.querySelector(s);
    const qa = s => Array.prototype.slice.call(root.querySelectorAll(s));
    const tl = gsap.timeline({ paused: true });

    /* entrada → HOLD → saída. O HOLD é explícito e nada o atravessa. */
    function show(el, at, enter, hold, exit, rise){
      const dy = (rise === undefined ? 20 : rise);
      tl.set(el, { autoAlpha:0, y:dy }, 0);   // estado inicial explicito: seek em t=0 pousa certo
      tl.fromTo(el, { autoAlpha:0, y:dy }, { autoAlpha:1, y:0, duration:enter, ease:'power3.out' }, at);
      if (exit > 0) tl.to(el, { autoAlpha:0, y:-dy*0.7, duration:exit, ease:'power2.in' }, at+enter+hold);
      return at+enter+hold+(exit>0?exit:0);
    }
    /* revelação por máscara vertical — a entrada da tese */
    function mask(el, at, enter, hold, exit){
      const inner = el.querySelector('span');
      tl.set(el, { autoAlpha:1 }, 0);
      tl.set(inner, { yPercent:106 }, 0);     // idem: a mascara comeca fechada
      tl.fromTo(inner, { yPercent:106 }, { yPercent:0, duration:enter, ease:'power3.out' }, at);
      if (exit > 0) tl.to(inner, { yPercent:-106, duration:exit, ease:'power2.in' }, at+enter+hold);
      return at+enter+hold+(exit>0?exit:0);
    }

    tl.set(q('.field'), { autoAlpha:1 }, 0);
    tl.set(q('.cam'), { scale:.12 }, 0);
    /* a repeticao e o argumento: mesma mecanica, mesmo intervalo, tres vezes */
    [0, 1, 2].forEach(function(i){
      const at = i * 0.7;
      show(q('.d' + i), at, .3, 6.0, 0, 10);
      tl.fromTo(q('.l' + i), { autoAlpha:0, scaleX:0 }, { autoAlpha:1, scaleX:1, duration:.4, ease:'power2.out', transformOrigin:'0% 50%' }, at + .22);
      show(q('.h' + i), at + .42, .3, 5.6 - i * .7, 0, 10);
    });
    tl.fromTo(q('.lk'), { autoAlpha:0 }, { autoAlpha:1, duration:.5, ease:'power2.out' }, 2.1);
    show(q('.dk'), 2.3, .3, 4.4, 0, 10);
    show(q('.hk'), 2.4, .35, 4.3, 0, 10);
    /* o diagrama baixa e a mensagem mais importante do fim assume */
    tl.set(q('.dg'), { autoAlpha:1 }, 0);
    tl.to(q('.dg'), { autoAlpha:.34, duration:.7, ease:'power2.inOut' }, 2.8);
    show(q('.t-not'), 3.2, .4, 4.3, 0);   // HOLD 4.3s

    window.__timelines["12-nao-substituir"] = tl;
  })();
  </script>
